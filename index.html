<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Mini Bowling AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    text-align: center;
}

h1 {
    margin: 16px 0 3px;
    font-size: 25px;
}

.subtitle {
    color: #999;
    font-size: 13px;
    margin-bottom: 12px;
}

.camera-wrap {
    position: relative;
    width: 94%;
    max-width: 650px;
    margin: auto;
    overflow: hidden;
    border-radius: 18px;
    background: #111;
}

video {
    width: 100%;
    display: block;
    background: #222;
}

canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.status {
    width: 94%;
    max-width: 650px;
    margin: 12px auto;
    padding: 13px;
    border-radius: 14px;
    background: #171717;
    font-size: 15px;
}

.status strong {
    color: #43d17a;
}

.controls {
    width: 94%;
    max-width: 650px;
    margin: 10px auto;
}

button {
    border: 0;
    border-radius: 13px;
    padding: 14px 17px;
    margin: 5px;
    font-size: 16px;
    font-weight: 700;
}

.camera-btn {
    background: #1976ff;
    color: white;
}

.ready-btn {
    background: #16a866;
    color: white;
}

.manual-btn {
    background: #555;
    color: white;
}

.reset-btn {
    background: #9b2929;
    color: white;
}

button:disabled {
    opacity: 0.35;
}

.result {
    width: 94%;
    max-width: 650px;
    margin: 15px auto;
    padding: 18px;
    border-radius: 18px;
    background: #171717;
}

.result-title {
    color: #aaa;
}

.result-number {
    font-size: 48px;
    font-weight: 800;
    margin: 3px 0;
}

.result-label {
    color: #aaa;
}

.message {
    font-size: 18px;
    font-weight: 700;
    margin-top: 8px;
}

.scoreboard {
    width: 95%;
    max-width: 750px;
    margin: 20px auto 40px;
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 650px;
    border-collapse: collapse;
}

th,
td {
    border: 1px solid #444;
    padding: 10px 7px;
}

th {
    background: #222;
}

td {
    background: #111;
}

.help {
    width: 94%;
    max-width: 650px;
    margin: 10px auto 30px;
    color: #888;
    font-size: 13px;
    line-height: 1.7;
}

/* 핀 표시 */
.pin-marker {
    position: absolute;
    width: 32px;
    height: 32px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 3px solid #42e878;
    pointer-events: none;
}

</style>
</head>

<body>

<h1>🎳 MINI BOWLING AI</h1>

<div class="subtitle">
손으로 핀을 다시 세워도 자동으로 대응합니다
</div>

<div class="camera-wrap">

    <video id="camera"
           autoplay
           playsinline
           muted></video>

    <canvas id="overlay"></canvas>

</div>

<div class="status" id="status">
    📷 먼저 카메라를 시작하세요.
</div>

<div class="controls">

    <button class="camera-btn"
            id="cameraBtn"
            onclick="startCamera()">
        📷 카메라 시작
    </button>

    <br>

    <button class="ready-btn"
            id="readyBtn"
            onclick="prepareThrow()"
            disabled>
        🎳 핀 세우기 완료 — READY
    </button>

    <button class="manual-btn"
            id="testBtn"
            onclick="testDetection()"
            disabled>
        🔎 지금 상태 테스트
    </button>

    <br>

    <button class="reset-btn"
            onclick="newGame()">
        🔄 새 게임
    </button>

</div>

<div class="result">

    <div class="result-title">
        이번 투구
    </div>

    <div class="result-number"
         id="fallen">
        -
    </div>

    <div class="result-label">
        쓰러진 핀
    </div>

    <div class="message"
         id="message">
        핀을 세워주세요.
    </div>

</div>

<div class="help">

    <b>사용법</b><br>
    ① 휴대폰을 게임판 위에 고정합니다.<br>
    ② 손으로 핀 10개를 모두 세웁니다.<br>
    ③ 손을 치운 뒤 <b>READY</b>를 누릅니다.<br>
    ④ 공을 굴립니다.<br>
    ⑤ 핀이 멈추면 자동으로 쓰러진 핀을 계산합니다.<br>
    ⑥ 다시 손으로 핀을 세운 뒤 READY를 누릅니다.<br><br>

    ⚠️ READY를 누를 때는 손이 화면에서 빠져 있어야 합니다.

</div>

<div class="scoreboard">

<table>

<thead>
<tr>
    <th>프레임</th>
    <th>1구</th>
    <th>2구</th>
    <th>점수</th>
</tr>
</thead>

<tbody id="scoreBody"></tbody>

</table>

</div>


<script>

/* =====================================================
   기본 변수
===================================================== */

const video =
    document.getElementById("camera");

const overlay =
    document.getElementById("overlay");

const ctx =
    overlay.getContext("2d");

const statusEl =
    document.getElementById("status");

const fallenEl =
    document.getElementById("fallen");

const messageEl =
    document.getElementById("message");

const readyBtn =
    document.getElementById("readyBtn");

const testBtn =
    document.getElementById("testBtn");

let stream = null;

let cameraReady = false;

let readyForThrow = false;

let monitoring = false;

let baseline = null;

let lastFrame = null;

let motionDetected = false;

let stableCounter = 0;

let analysisTimer = null;

let throws = [];

let gameFinished = false;


/* =====================================================
   미니 볼링판 4-3-2-1 배치

   사진 기준 정규화 좌표
   x = 0~1
   y = 0~1

   뒤쪽 4개
   중간 3개
   앞쪽 2개
   맨 앞 1개
===================================================== */

const PIN_POSITIONS = [

    // 뒤쪽 4개
    { x: 0.31, y: 0.29 },
    { x: 0.48, y: 0.28 },
    { x: 0.65, y: 0.28 },
    { x: 0.80, y: 0.29 },

    // 3개
    { x: 0.39, y: 0.36 },
    { x: 0.54, y: 0.36 },
    { x: 0.69, y: 0.36 },

    // 2개
    { x: 0.46, y: 0.43 },
    { x: 0.60, y: 0.43 },

    // 맨 앞
    { x: 0.53, y: 0.51 }
];


/* =====================================================
   카메라 시작
===================================================== */

async function startCamera() {

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }
                },

                audio: false
            });

        video.srcObject = stream;

        await video.play();

        overlay.width =
            video.videoWidth;

        overlay.height =
            video.videoHeight;

        cameraReady = true;

        readyBtn.disabled = false;
        testBtn.disabled = false;

        setStatus(
            "카메라 준비 완료. 핀 10개를 세워주세요.",
            false
        );

        drawPinPositions();

    }

    catch(error) {

        console.error(error);

        setStatus(
            "카메라 권한을 허용해주세요.",
            false
        );

        alert(
            "카메라를 사용할 수 없습니다.\n\n" +
            "Safari의 카메라 권한을 허용해주세요."
        );

    }

}


/* =====================================================
   상태 표시
===================================================== */

function setStatus(text, good) {

    if (good) {

        statusEl.innerHTML =
            "<strong>" + text + "</strong>";

    } else {

        statusEl.textContent = text;

    }

}


/* =====================================================
   현재 화면 캡처
===================================================== */

function captureFrame() {

    if (!cameraReady) {
        return null;
    }

    ctx.drawImage(
        video,
        0,
        0,
        overlay.width,
        overlay.height
    );

    return ctx.getImageData(
        0,
        0,
        overlay.width,
        overlay.height
    );

}


/* =====================================================
   두 이미지의 차이 계산

   손이 움직이거나 공이 움직이면
   큰 변화가 발생한다.
===================================================== */

function imageDifference(a, b) {

    if (!a || !b) {
        return 1;
    }

    const dataA = a.data;
    const dataB = b.data;

    /*
       전체 픽셀을 다 비교하지 않고
       일정 간격으로 샘플링
    */

    const step = 8;

    let difference = 0;

    let count = 0;

    for (
        let i = 0;
        i < dataA.length;
        i += 4 * step
    ) {

        const r =
            Math.abs(dataA[i] - dataB[i]);

        const g =
            Math.abs(dataA[i + 1] - dataB[i + 1]);

        const bl =
            Math.abs(dataA[i + 2] - dataB[i + 2]);

        const d =
            (r + g + bl) / 3;

        if (d > 25) {
            difference++;
        }

        count++;

    }

    return difference / count;
}


/* =====================================================
   특정 핀 주변의 검은색 픽셀 비율

   네 핀은 검은 테이프가 있어서
   흰색 판과 구분하기 쉽다.
===================================================== */

function getDarkRatio(image, pin) {

    if (!image) {
        return 0;
    }

    const width =
        image.width;

    const height =
        image.height;

    const cx =
        Math.floor(pin.x * width);

    const cy =
        Math.floor(pin.y * height);

    /*
       핀 주변 영역

       실제 미니게임 크기에 맞춰
       비교적 넓게 잡음
    */

    const radiusX =
        Math.floor(width * 0.055);

    const radiusY =
        Math.floor(height * 0.065);

    let dark = 0;

    let total = 0;

    for (
        let y = cy - radiusY;
        y < cy + radiusY;
        y += 4
    ) {

        if (
            y < 0 ||
            y >= height
        ) {
            continue;
        }

        for (
            let x = cx - radiusX;
            x < cx + radiusX;
            x += 4
        ) {

            if (
                x < 0 ||
                x >= width
            ) {
                continue;
            }

            const index =
                (y * width + x) * 4;

            const r =
                image.data[index];

            const g =
                image.data[index + 1];

            const b =
                image.data[index + 2];

            /*
               검은 테이프 판정
            */

            const brightness =
                (r + g + b) / 3;

            if (brightness < 85) {
                dark++;
            }

            total++;

        }

    }

    if (total === 0) {
        return 0;
    }

    return dark / total;

}


/* =====================================================
   핀별 상태 계산
===================================================== */

function analyzePins(image) {

    if (!baseline || !image) {
        return null;
    }

    let fallen = 0;

    const results = [];

    for (
        let i = 0;
        i < PIN_POSITIONS.length;
        i++
    ) {

        const pin =
            PIN_POSITIONS[i];

        const before =
            getDarkRatio(
                baseline,
                pin
            );

        const after =
            getDarkRatio(
                image,
                pin
            );

        /*
           기준 상태와 현재 상태의 변화량
        */

        const change =
            Math.abs(
                after - before
            );

        /*
           핀이 서 있을 때와
           쓰러졌을 때 주변의 검은 테이프
           분포가 달라지는 것을 이용

           너무 작은 변화는 무시
        */

        let isFallen = false;

        if (change > 0.035) {
            isFallen = true;
        }

        /*
           현재 검은 영역이
           기준보다 크게 줄거나 늘어났을 경우
        */

        if (
            before > 0.025 &&
            after < before * 0.45
        ) {

            isFallen = true;

        }

        results.push({
            index: i,
            before: before,
            after: after,
            change: change,
            fallen: isFallen
        });

        if (isFallen) {
            fallen++;
        }

    }

    /*
       0~10 제한
    */

    fallen =
        Math.max(
            0,
            Math.min(
                10,
                fallen
            )
        );

    return {
        fallen: fallen,
        pins: results
    };

}


/* =====================================================
   핀 위치 표시
===================================================== */

function drawPinPositions(results = null) {

    if (!cameraReady) {
        return;
    }

    ctx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );

    for (
        let i = 0;
        i < PIN_POSITIONS.length;
        i++
    ) {

        const p =
            PIN_POSITIONS[i];

        let fallen = false;

        if (results) {

            const result =
                results.find(
                    r => r.index === i
                );

            if (result) {
                fallen =
                    result.fallen;
            }

        }

        const x =
            p.x * overlay.width;

        const y =
            p.y * overlay.height;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            17,
            0,
            Math.PI * 2
        );

        ctx.lineWidth = 4;

        ctx.strokeStyle =
            fallen
            ? "#ff3030"
            : "#32e875";

        ctx.stroke();

        ctx.fillStyle =
            fallen
            ? "#ff3030"
            : "#32e875";

        ctx.font =
            "bold 15px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            i + 1,
            x,
            y
        );

    }

}


/* =====================================================
   READY

   손으로 핀을 세운 뒤
   손이 화면에서 빠졌을 때 누름
===================================================== */

function prepareThrow() {

    if (!cameraReady) {
        return;
    }

    if (monitoring) {
        return;
    }

    setStatus(
        "손을 화면에서 빼는 중... 기준 상태를 저장합니다.",
        false
    );

    readyBtn.disabled = true;

    /*
       1초 기다린 뒤 기준 이미지 저장

       손을 빼는 시간을 확보
    */

    setTimeout(() => {

        baseline =
            captureFrame();

        if (!baseline) {

            readyBtn.disabled = false;

            return;

        }

        readyForThrow = true;

        monitoring = true;

        motionDetected = false;

        stableCounter = 0;

        lastFrame =
            baseline;

        setStatus(
            "READY! 이제 공을 굴리세요 🎳",
            true
        );

        messageEl.textContent =
            "공을 굴리세요!";

        /*
           자동 감시 시작
        */

        startMonitoring();

    }, 1000);

}


/* =====================================================
   공 굴림 / 움직임 감지

   계속 화면을 비교하다가
   움직임 발생 → 움직임 종료를 감지
===================================================== */

function startMonitoring() {

    if (analysisTimer) {
        clearInterval(analysisTimer);
    }

    analysisTimer =
        setInterval(() => {

            if (!monitoring) {
                return;
            }

            const current =
                captureFrame();

            if (!current) {
                return;
            }

            const difference =
                imageDifference(
                    lastFrame,
                    current
                );

            lastFrame =
                current;

            /*
               움직임 발생
            */

            if (difference > 0.025) {

                motionDetected = true;

                stableCounter = 0;

                setStatus(
                    "🎳 움직임 감지!",
                    true
                );

                return;

            }

            /*
               움직임이 끝난 상태
            */

            if (motionDetected) {

                stableCounter++;

                /*
                   약 1초 정도 안정되면
                   판정
                */

                if (stableCounter >= 8) {

                    finishThrow();

                }

            }

        }, 120);

}


/* =====================================================
   투구 종료
===================================================== */

function finishThrow() {

    if (!monitoring) {
        return;
    }

    monitoring = false;

    clearInterval(
        analysisTimer
    );

    analysisTimer = null;

    const current =
        captureFrame();

    const result =
        analyzePins(current);

    if (!result) {

        readyBtn.disabled = false;

        return;

    }

    const fallen =
        result.fallen;

    fallenEl.textContent =
        fallen;

    drawPinPositions(
        result.pins
    );

    /*
       점수 기록
    */

    recordThrow(
        fallen
    );

    /*
       메시지
    */

    if (fallen === 10) {

        messageEl.textContent =
            "🔥 STRIKE!";

    } else if (
        throws.length >= 2 &&
        throws[throws.length - 2] +
        throws[throws.length - 1] === 10
    ) {

        messageEl.textContent =
            "✨ SPARE!";

    } else {

        messageEl.textContent =
            fallen + "개 쓰러졌습니다.";

    }

    /*
       다음 투구 준비

       손으로 핀을 다시 세우는 동안에는
       자동 판정하지 않는다.
    */

    readyForThrow = false;

    readyBtn.disabled =
        !cameraReady;

    setStatus(
        "핀을 다시 세운 뒤 READY를 눌러주세요.",
        false
    );

}


/* =====================================================
   테스트 버튼

   현재 화면을 바로 분석
===================================================== */

function testDetection() {

    if (!baseline) {

        alert(
            "먼저 READY를 눌러 기준 상태를 저장하세요."
        );

        return;

    }

    const current =
        captureFrame();

    const result =
        analyzePins(current);

    if (!result) {
        return;
    }

    fallenEl.textContent =
        result.fallen;

    drawPinPositions(
        result.pins
    );

    messageEl.textContent =
        result.fallen +
        "개 쓰러짐";

}


/* =====================================================
   점수 기록
===================================================== */

function recordThrow(pinsDown) {

    /*
       최대 21구 정도 저장 가능
    */

    if (throws.length >= 21) {
        return;
    }

    throws.push(
        pinsDown
    );

    updateScoreboard();

}


/* =====================================================
   실제 볼링 점수 계산

   일반적인 10프레임 방식
===================================================== */

function calculateBowlingScores(rolls) {

    const scores = [];

    let roll = 0;

    let total = 0;

    for (
        let frame = 0;
        frame < 10;
        frame++
    ) {

        if (
            rolls[roll] === undefined
        ) {
            break;
        }

        const first =
            rolls[roll];

        /*
           STRIKE
        */

        if (first === 10) {

            if (
                rolls[roll + 1] === undefined ||
                rolls[roll + 2] === undefined
            ) {
                break;
            }

            total =
                total +
                10 +
                rolls[roll + 1] +
                rolls[roll + 2];

            scores.push(total);

            roll += 1;

        }

        /*
           일반 / SPARE
        */

        else {

            if (
                rolls[roll + 1] === undefined
            ) {
                break;
            }

            const second =
                rolls[roll + 1];

            /*
               SPARE
            */

            if (
                first + second === 10
            ) {

                if (
                    rolls[roll + 2] === undefined
                ) {
                    break;
                }

                total =
                    total +
                    10 +
                    rolls[roll + 2];

            }

            /*
               일반
            */

            else {

                total =
                    total +
                    first +
                    second;

            }

            scores.push(total);

            roll += 2;

        }

    }

    return scores;

}


/* =====================================================
   스코어보드 표시
===================================================== */

function updateScoreboard() {

    const body =
        document.getElementById(
            "scoreBody"
        );

    body.innerHTML = "";

    const scores =
        calculateBowlingScores(
            throws
        );

    let rollIndex = 0;

    for (
        let frame = 1;
        frame <= 10;
        frame++
    ) {

        let first = "";
        let second = "";

        if (
            throws[rollIndex] !== undefined
        ) {

            first =
                throws[rollIndex];

        }

        /*
           STRIKE
        */

        if (first === 10) {

            second = "";

            rollIndex++;

        }

        else {

            if (
                throws[rollIndex + 1] !== undefined
            ) {

                second =
                    throws[rollIndex + 1];

            }

            if (
                first !== "" &&
                second !== ""
            ) {

                rollIndex += 2;

            }

        }

        const score =
            scores[frame - 1] !== undefined
            ? scores[frame - 1]
            : "";

        const row =
            document.createElement("tr");

        row.innerHTML = `
            <td>${frame}</td>
            <td>${first}</td>
            <td>${second}</td>
            <td>${score}</td>
        `;

        body.appendChild(row);

    }

}


/* =====================================================
   새 게임
===================================================== */

function newGame() {

    if (
        analysisTimer
    ) {

        clearInterval(
            analysisTimer
        );

    }

    baseline = null;

    lastFrame = null;

    monitoring = false;

    readyForThrow = false;

    motionDetected = false;

    stableCounter = 0;

    throws = [];

    fallenEl.textContent =
        "-";

    messageEl.textContent =
        "핀을 세워주세요.";

    readyBtn.disabled =
        !cameraReady;

    updateScoreboard();

    if (cameraReady) {

        setStatus(
            "새 게임! 핀 10개를 세워주세요.",
            false
        );

        drawPinPositions();

    }

}


/* =====================================================
   시작
===================================================== */

updateScoreboard();

</script>
