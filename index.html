<style>

/* =========================================================

========================================================= */

        손으로 핀을 세우는 동안에는 점수를 계산하지 않습니다.

<script>

/* =========================================================
   DOM
========================================================= */

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("processCanvas");

const ctx =
    canvas.getContext(
        "2d",
        {
            willReadFrequently:true
        }
    );


const startButton =
    document.getElementById("startButton");

const statusTitle =
    document.getElementById("statusTitle");

const statusText =
    document.getElementById("statusText");

const totalScoreEl =
    document.getElementById("totalScore");

const frameNumberEl =
    document.getElementById("frameNumber");

const throwNumberEl =
    document.getElementById("throwNumber");

const pinNumberEl =
    document.getElementById("pinNumber");

const framesEl =
    document.getElementById("frames");

const lastResultEl =
    document.getElementById("lastResult");


/* =========================================================
   PROCESSING CONFIG
========================================================= */

/*
   실제 카메라는 고해상도로 촬영하고
   분석은 작은 화면으로 다운스케일해서
   아이폰에서 부담을 줄인다.
*/

const PROCESS_WIDTH = 480;
const PROCESS_HEIGHT = 270;


/*
   사진처럼 카메라가 위에서 고정되어 있다고 가정.

   4
   3
   2
   1

   형태의 핀 위치.

   처음 실행할 때 자동으로 이 주변에서
   핀을 찾는다.
*/

const PIN_POSITIONS = [

    {x:0.31,y:0.29},
    {x:0.48,y:0.28},
    {x:0.65,y:0.28},
    {x:0.80,y:0.29},

    {x:0.39,y:0.36},
    {x:0.54,y:0.36},
    {x:0.69,y:0.36},

    {x:0.46,y:0.43},
    {x:0.60,y:0.43},

    {x:0.53,y:0.51}

];


/*
   상태
*/

let state =
    "WAIT_SETUP";


/*
   카메라
*/

let stream =
    null;


/*
   현재 프레임 이미지
*/

let previousImage =
    null;


/*
   최초 핀 배치
*/

let standingTemplate =
    null;


/*
   이번 투구 직전 상태
*/

let baseline =
    null;


/*
   현재 투구에서 실제로
   점수 대상이 되는 핀
*/

let activePins =
    Array.from(
        {length:10},
        (_,i)=>i
    );


/*
   쓰러진 핀
*/

let fallenPins = [];


/*
   볼링 기록
*/

let rolls = [];


/*
   현재 프레임
*/

let currentFrame = 1;


/*
   현재 투구
*/

let currentThrow = 1;


/*
   감지용 카운터
*/

let setupStable = 0;

let readyMovement = 0;

let stopStable = 0;

let resetStable = 0;


/*
   결과 중복 방지
*/

let resultLocked = false;


/*
   처리 주기
*/

let lastProcessTime = 0;


/*
   약 5~6fps 정도로 분석
*/

const PROCESS_INTERVAL = 180;


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    title,
    text=""
){

    statusTitle.textContent =
        title;

    statusText.textContent =
        text;

}


/* =========================================================
   CAMERA
========================================================= */

async function startGame(){

    startButton.classList.add(
        "hidden"
    );


    setStatus(
        "카메라 준비 중...",
        "후면 카메라를 연결하고 있습니다."
    );


    try{

        stream =
            await navigator.mediaDevices.getUserMedia({

                audio:false,

                video:{
                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }
                }

            });


        video.srcObject =
            stream;


        await video.play();


        canvas.width =
            PROCESS_WIDTH;

        canvas.height =
            PROCESS_HEIGHT;


        /*
           화면 켜짐 유지
        */

        try{

            if(
                "wakeLock" in navigator
            ){

                await navigator.wakeLock.request(
                    "screen"
                );

            }

        }catch(e){}


        setStatus(
            "핀 10개를 세워주세요.",
            "손을 치우면 자동으로 인식합니다."
        );


        state =
            "WAIT_SETUP";


        requestAnimationFrame(
            loop
        );

    }

    catch(error){

        console.error(error);


        startButton.classList.remove(
            "hidden"
        );


        setStatus(
            "카메라를 사용할 수 없습니다.",
            "Safari에서 카메라 권한을 허용해주세요."
        );

    }

}


/* =========================================================
   CAPTURE
========================================================= */

function capture(){

    if(
        !video.videoWidth ||
        !video.videoHeight
    ){

        return null;

    }


    ctx.drawImage(
        video,
        0,
        0,
        PROCESS_WIDTH,
        PROCESS_HEIGHT
    );


    return ctx.getImageData(
        0,
        0,
        PROCESS_WIDTH,
        PROCESS_HEIGHT
    );

}


/* =========================================================
   PIN FEATURE
========================================================= */

function getPinFeature(
    image,
    pin
){

    const w =
        image.width;

    const h =
        image.height;


    const cx =
        Math.round(
            pin.x*w
        );

    const cy =
        Math.round(
            pin.y*h
        );


    /*
       핀 주변 영역
    */

    const rx =
        Math.round(
            w*0.055
        );

    const ry =
        Math.round(
            h*0.075
        );


    let total = 0;

    let bright = 0;

    let dark = 0;

    let sx = 0;

    let sy = 0;


    for(
        let y=cy-ry;
        y<=cy+ry;
        y+=3
    ){

        for(
            let x=cx-rx;
            x<=cx+rx;
            x+=3
        ){

            if(
                x<0 ||
                y<0 ||
                x>=w ||
                y>=h
            ){

                continue;

            }


            const index =
                (y*w+x)*4;


            const r =
                image.data[index];

            const g =
                image.data[index+1];

            const b =
                image.data[index+2];


            const brightness =
                (
                    r+
                    g+
                    b
                )/3;


            total++;


            if(
                brightness>165
            ){

                bright++;

            }


            if(
                brightness<80
            ){

                dark++;

                sx += x-cx;

                sy += y-cy;

            }

        }

    }


    let darkX = 0;

    let darkY = 0;


    if(dark>0){

        darkX =
            sx/dark/rx;

        darkY =
            sy/dark/ry;

    }


    return {

        bright:
            bright/Math.max(total,1),

        dark:
            dark/Math.max(total,1),

        darkX,
        darkY

    };

}


/* =========================================================
   PIN PRESENCE
========================================================= */

function pinPresence(
    feature
){

    /*
       흰색 몸통 + 검은색 테이프
    */

    const white =
        Math.min(
            feature.bright/0.20,
            1
        );


    const black =
        Math.min(
            feature.dark/0.025,
            1
        );


    return (
        white*0.65+
        black*0.35
    );

}


/* =========================================================
   PIN DISTANCE
========================================================= */

function featureDistance(
    a,
    b
){

    if(
        !a ||
        !b
    ){

        return 999;

    }


    const bright =
        Math.abs(
            a.bright-
            b.bright
        );


    const dark =
        Math.abs(
            a.dark-
            b.dark
        );


    const x =
        Math.abs(
            a.darkX-
            b.darkX
        );


    const y =
        Math.abs(
            a.darkY-
            b.darkY
        );


    return (
        bright*1.2+
        dark*1.5+
        x*0.4+
        y*0.4
    );

}


/* =========================================================
   DETECT ALL PINS
========================================================= */

function detectPins(
    image
){

    const result = [];

    let count = 0;


    for(
        let i=0;
        i<PIN_POSITIONS.length;
        i++
    ){

        const feature =
            getPinFeature(
                image,
                PIN_POSITIONS[i]
            );


        const presence =
            pinPresence(
                feature
            );


        const standing =
            presence >
            0.42;


        if(standing){

            count++;

        }


        result.push({

            standing,
            presence,
            feature

        });

    }


    return {

        count,
        pins:result

    };

}


/* =========================================================
   MOVEMENT
========================================================= */

function movement(
    a,
    b,
    mode="lane"
){

    if(
        !a ||
        !b
    ){

        return 0;

    }


    let xStart = 0;

    let xEnd = PROCESS_WIDTH;

    let yStart = 0;

    let yEnd = PROCESS_HEIGHT;


    /*
       READY 상태에서는
       공이 굴러오는 레인만 감지.

       핀을 손으로 만지는 움직임 때문에
       투구가 시작되는 것을 방지한다.
    */

    if(
        mode==="lane"
    ){

        xStart =
            Math.round(
                PROCESS_WIDTH*0.08
            );

        xEnd =
            Math.round(
                PROCESS_WIDTH*0.92
            );

        yStart =
            Math.round(
                PROCESS_HEIGHT*0.45
            );

        yEnd =
            Math.round(
                PROCESS_HEIGHT*0.98
            );

    }


    /*
       결과 정지 감지는
       핀 영역까지 포함.
    */

    if(
        mode==="all"
    ){

        xStart =
            Math.round(
                PROCESS_WIDTH*0.05
            );

        xEnd =
            Math.round(
                PROCESS_WIDTH*0.95
            );

        yStart =
            Math.round(
                PROCESS_HEIGHT*0.12
            );

        yEnd =
            Math.round(
                PROCESS_HEIGHT*0.98
            );

    }


    let changed = 0;

    let total = 0;


    /*
       빠른 분석
    */

    for(
        let y=yStart;
        y<yEnd;
        y+=10
    ){

        for(
            let x=xStart;
            x<xEnd;
            x+=10
        ){

            const i =
                (y*PROCESS_WIDTH+x)*4;


            const aGray =
                (
                    a.data[i]+
                    a.data[i+1]+
                    a.data[i+2]
                )/3;


            const bGray =
                (
                    b.data[i]+
                    b.data[i+1]+
                    b.data[i+2]
                )/3;


            const difference =
                Math.abs(
                    aGray-bGray
                );


            if(
                difference>35
            ){

                changed++;

            }


            total++;

        }

    }


    return (
        changed/
        Math.max(total,1)
    );

}


/* =========================================================
   INITIAL CALIBRATION
========================================================= */

function calibrate(
    image
){

    const detected =
        detectPins(
            image
        );


    /*
       처음에는 반드시 10개를
       안정적으로 찾아야 한다.
    */

    if(
        detected.count===10
    ){

        setupStable++;


        setStatus(
            "핀 위치 확인 중",
            "10/10 · "+
            setupStable+
            "/10"
        );


    }
    else{

        setupStable=0;


        setStatus(
            "핀 10개를 세워주세요.",
            "현재 감지: "+
            detected.count+
            "/10"
        );

    }


    /*
       10프레임 동안 동일하게 감지
    */

    if(
        setupStable>=10
    ){

        standingTemplate =
            detected.pins.map(
                p=>p.feature
            );


        baseline =
            detected.pins.map(
                p=>p.feature
            );


        activePins =
            Array.from(
                {length:10},
                (_,i)=>i
            );


        previousImage =
            image;


        state =
            "READY";


        setupStable=0;


        setStatus(
            "● READY",
            "공을 굴리세요."
        );


        pinNumberEl.textContent =
            "10";

    }

}


/* =========================================================
   CHECK STABLE REQUIRED PINS
========================================================= */

function requiredPinsReady(
    image
){

    if(
        !standingTemplate
    ){

        return false;

    }


    let ready = 0;


    for(
        const index of activePins
    ){

        const feature =
            getPinFeature(
                image,
                PIN_POSITIONS[index]
            );


        /*
           최초의 정상적인 서있는 핀과 비교
        */

        const distance =
            featureDistance(
                feature,
                standingTemplate[index]
            );


        const presence =
            pinPresence(
                feature
            );


        if(
            distance<0.11 &&
            presence>0.35
        ){

            ready++;

        }

    }


    return (
        ready===
        activePins.length
    );

}


/* =========================================================
   FIND FALLEN PINS
========================================================= */

function findFallenPins(
    image
){

    const fallen = [];


    if(
        !baseline
    ){

        return fallen;

    }


    for(
        const index of activePins
    ){

        const current =
            getPinFeature(
                image,
                PIN_POSITIONS[index]
            );


        const before =
            baseline[index];


        const distance =
            featureDistance(
                current,
                before
            );


        /*
           서있는 핀과 현재 핀의 차이가
           충분히 크면 쓰러진 것으로 판단.
        */

        if(
            distance>0.105
        ){

            fallen.push(
                index
            );

        }

    }


    return fallen;

}


/* =========================================================
   START THROW
========================================================= */

function beginThrow(){

    state =
        "THROWING";


    stopStable=0;


    resultLocked=false;


    setStatus(
        "🎳 THROWING",
        "공과 핀의 움직임을 확인하는 중"
    );

}


/* =========================================================
   PROCESS THROW
========================================================= */

function processThrow(
    image
){

    if(
        resultLocked
    ){

        return;

    }


    const fallen =
        findFallenPins(
            image
        );


    /*
       너무 짧은 움직임이면
       오작동 방지
    */

    if(
        fallen.length===0 &&
        activePins.length>0
    ){

        /*
           아무것도 안 쓰러진 경우도
           실제 결과일 수 있으므로
           바로 실패시키지 않는다.
        */

    }


    resultLocked=true;


    recordRoll(
        fallen.length,
        fallen
    );

}


/* =========================================================
   RECORD ROLL
========================================================= */

function recordRoll(
    knocked,
    fallen
){

    knocked =
        Math.max(
            0,
            Math.min(
                activePins.length,
                knocked
            )
        );


    rolls.push(
        knocked
    );


    fallenPins =
        fallen;


    lastResultEl.textContent =
        knocked===10
        ? "STRIKE!"
        : knocked;


    /*
       다음 투구를 위한
       살아남은 핀
    */

    const survivors =
        activePins.filter(
            i =>
                !fallen.includes(i)
        );


    /*
       볼링 진행
    */

    advanceBowling(
        knocked,
        survivors
    );


    updateScoreboard();


    /*
       다음 준비 단계
    */

    state =
        "WAIT_RESET";


    resetStable=0;


    previousImage=null;


    if(
        currentFrame>10
    ){

        setStatus(
            "🏆 GAME COMPLETE",
            "최종 점수: "+
            calculateTotal()
        );

        return;

    }


    setStatus(
        "결과: "+knocked+"개",
        "핀을 정리하면 자동으로 다음 투구가 준비됩니다."
    );

}


/* =========================================================
   BOWLING STATE
========================================================= */

function advanceBowling(
    knocked,
    survivors
){

    /*
       1~9 프레임
    */

    if(
        currentFrame<10
    ){

        /*
           1구
        */

        if(
            currentThrow===1
        ){

            /*
               스트라이크
            */

            if(
                knocked===10
            ){

                currentFrame++;

                currentThrow=1;

                activePins =
                    Array.from(
                        {length:10},
                        (_,i)=>i
                    );

            }

            else{

                /*
                   2구에서는
                   첫 구에서 살아남은 핀만
                   점수 대상
                */

                currentThrow=2;

                activePins =
                    survivors;

            }

        }

        /*
           2구
        */

        else{

            currentFrame++;

            currentThrow=1;

            activePins =
                Array.from(
                    {length:10},
                    (_,i)=>i
                );

        }

        return;

    }


    /*
       ==========================================
       10 프레임
       ==========================================
    */


    if(
        currentFrame===10
    ){

        /*
           10프레임 1구
        */

        if(
            currentThrow===1
        ){

            currentThrow=2;


            /*
               스트라이크면
               2구는 다시 10개
            */

            if(
                knocked===10
            ){

                activePins =
                    Array.from(
                        {length:10},
                        (_,i)=>i
                    );

            }

            else{

                activePins =
                    survivors;

            }


            return;

        }


        /*
           10프레임 2구
        */

        if(
            currentThrow===2
        ){

            const first =
                rolls[
                    rolls.length-2
                ];


            /*
               스트라이크 또는 스페어면
               3구
            */

            if(
                first===10 ||
                first+knocked===10
            ){

                currentThrow=3;


                /*
                   10프레임 스페어:
                   3구는 새로 10개

                   첫 구 스트라이크 후
                   2구가 스트라이크면
                   3구도 10개

                   첫 구 스트라이크 후
                   2구가 일반 투구면
                   살아남은 핀
                */

                if(
                    first!==10 ||
                    knocked===10
                ){

                    activePins =
                        Array.from(
                            {length:10},
                            (_,i)=>i
                        );

                }

                else{

                    activePins =
                        survivors;

                }

                return;

            }


            /*
               일반 10프레임 종료
            */

            currentFrame=11;

            return;

        }


        /*
           10프레임 3구 종료
        */

        if(
            currentThrow===3
        ){

            currentFrame=11;

        }

    }

}


/* =========================================================
   WAIT RESET
========================================================= */

function processReset(
    image
){

    /*
       핀 위치가 안정적으로
       준비되어 있는지 확인
    */

    const pinsReady =
        requiredPinsReady(
            image
        );


    /*
       손 움직임이 있으면
       안정화 카운터를 초기화
    */

    const move =
        previousImage
        ? movement(
            previousImage,
            image,
            "all"
        )
        : 0;


    previousImage =
        image;


    if(
        pinsReady &&
        move<0.015
    ){

        resetStable++;


        setStatus(
            "핀 안정화 중",
            resetStable+
            "/12"
        );

    }
    else{

        resetStable=0;


        setStatus(
            "핀을 세우는 중...",
            "손을 치우면 자동으로 준비됩니다."
        );

    }


    /*
       충분히 안정되면
       새로운 기준 화면 저장
    */

    if(
        resetStable>=12
    ){

        baseline =
            allCurrentActiveFeatures(
                image
            );


        previousImage =
            image;


        state =
            "READY";


        resetStable=0;


        resultLocked=false;


        setStatus(
            "● READY",
            "공을 굴리세요."
        );


        pinNumberEl.textContent =
            activePins.length;

    }

}


/* =========================================================
   ACTIVE PIN BASELINE
========================================================= */

function allCurrentActiveFeatures(
    image
){

    /*
       전체 배열을 만들어 둔다.
       활성 핀만 현재 상태 저장.
    */

    const result =
        new Array(10);


    for(
        const index of activePins
    ){

        result[index] =
            getPinFeature(
                image,
                PIN_POSITIONS[index]
            );

    }


    /*
       비활성 핀도 안전하게
       이전 template을 사용
    */

    for(
        let i=0;
        i<10;
        i++
    ){

        if(
            !result[i]
        ){

            result[i] =
                standingTemplate
                ? standingTemplate[i]
                : getPinFeature(
                    image,
                    PIN_POSITIONS[i]
                );

        }

    }


    return result;

}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(
    timestamp
){

    if(
        !stream
    ){

        return;

    }


    /*
       분석 속도 제한
    */

    if(
        timestamp-lastProcessTime
        <
        PROCESS_INTERVAL
    ){

        requestAnimationFrame(
            loop
        );

        return;

    }


    lastProcessTime =
        timestamp;


    const image =
        capture();


    if(
        !image
    ){

        requestAnimationFrame(
            loop
        );

        return;

    }


    /* ================================================
       초기 핀 설정
    ================================================= */

    if(
        state==="WAIT_SETUP"
    ){

        calibrate(
            image
        );

    }


    /* ================================================
       READY
    ================================================= */

    else if(
        state==="READY"
    ){

        if(
            previousImage
        ){

            const motion =
                movement(
                    previousImage,
                    image,
                    "lane"
                );


            /*
               공이 레인에서 움직였을 때
            */

            if(
                motion>0.018
            ){

                readyMovement++;


                if(
                    readyMovement>=2
                ){

                    beginThrow();

                }

            }
            else{

                readyMovement=0;

            }

        }


        previousImage =
            image;

    }


    /* ================================================
       THROWING
    ================================================= */

    else if(
        state==="THROWING"
    ){

        const motion =
            movement(
                previousImage,
                image,
                "all"
            );


        previousImage =
            image;


        /*
           움직이는 중
        */

        if(
            motion>0.014
        ){

            stopStable=0;

        }

        else{

            stopStable++;

        }


        /*
           충분히 정지하면 결과 계산
        */

        if(
            stopStable>=10
        ){

            /*
               공이 완전히 멈춘 뒤
               조금 더 기다린 후 판정
            */

            processThrow(
                image
            );

        }

    }


    /* ================================================
       핀 재설치
    ================================================= */

    else if(
        state==="WAIT_RESET"
    ){

        processReset(
            image
        );

    }


    requestAnimationFrame(
        loop
    );

}


/* =========================================================
   SCORE CALCULATION
========================================================= */

function calculateFrameScores(){

    const scores =
        [];

    let index=0;

    let total=0;


    /*
       1~9 프레임
    */

    for(
        let frame=1;
        frame<=9;
        frame++
    ){

        if(
            rolls[index]===undefined
        ){

            scores.push(
                null
            );

            break;

        }


        const first =
            rolls[index];


        /*
           STRIKE
        */

        if(
            first===10
        ){

            if(
                rolls[index+1]===undefined ||
                rolls[index+2]===undefined
            ){

                scores.push(
                    null
                );

                break;

            }


            total +=
                10+
                rolls[index+1]+
                rolls[index+2];


            scores.push(
                total
            );


            index++;

            continue;

        }


        /*
           2구가 아직 없는 경우
        */

        if(
            rolls[index+1]===undefined
        ){

            scores.push(
                null
            );

            break;

        }


        const second =
            rolls[index+1];


        /*
           SPARE
        */

        if(
            first+second===10
        ){

            if(
                rolls[index+2]===undefined
            ){

                scores.push(
                    null
                );

                break;

            }


            total +=
                10+
                rolls[index+2];

        }

        else{

            total +=
                first+
                second;

        }


        scores.push(
            total
        );


        index+=2;

    }


    /*
       10 프레임
    */

    if(
        rolls[index]!==undefined
    ){

        const a =
            rolls[index];


        if(
            a===10
        ){

            const b =
                rolls[index+1];

            const c =
                rolls[index+2];


            if(
                b!==undefined &&
                c!==undefined
            ){

                total +=
                    10+b+c;

                scores.push(
                    total
                );

            }
            else{

                scores.push(
                    null
                );

            }

        }

        else if(
            rolls[index+1]!==undefined
        ){

            const b =
                rolls[index+1];


            if(
                a+b===10
            ){

                const c =
                    rolls[index+2];


                if(
                    c!==undefined
                ){

                    total +=
                        10+c;

                    scores.push(
                        total
                    );

                }
                else{

                    scores.push(
                        null
                    );

                }

            }

            else{

                total +=
                    a+b;

                scores.push(
                    total
                );

            }

        }

        else{

            scores.push(
                null
            );

        }

    }


    return scores;

}


/* =========================================================
   TOTAL
========================================================= */

function calculateTotal(){

    const scores =
        calculateFrameScores();


    for(
        let i=scores.length-1;
        i>=0;
        i--
    ){

        if(
            scores[i]!==null &&
            scores[i]!==undefined
        ){

            return scores[i];

        }

    }


    return 0;

}


/* =========================================================
   DISPLAY SCOREBOARD
========================================================= */

function updateScoreboard(){

    const scores =
        calculateFrameScores();


    totalScoreEl.textContent =
        calculateTotal();


    frameNumberEl.textContent =
        Math.min(
            currentFrame,
            10
        );


    throwNumberEl.textContent =
        currentThrow;


    pinNumberEl.textContent =
        activePins.length;


    framesEl.innerHTML="";


    /*
       10개 프레임 생성
    */

    let index=0;


    for(
        let frame=1;
        frame<=10;
        frame++
    ){

        const frameEl =
            document.createElement(
                "div"
            );


        frameEl.className =
            "frame";


        if(
            frame===currentFrame
        ){

            frameEl.classList.add(
                "active"
            );

        }


        const number =
            document.createElement(
                "div"
            );


        number.className =
            "frameNumber";


        number.textContent =
            frame;


        frameEl.appendChild(
            number
        );


        const rollsEl =
            document.createElement(
                "div"
            );


        rollsEl.className =
            "rolls";


        /*
           일반 프레임
        */

        if(
            frame<10
        ){

            const first =
                rolls[index];


            const second =
                rolls[index+1];


            const r1 =
                document.createElement(
                    "div"
                );

            r1.className =
                "roll";


            const r2 =
                document.createElement(
                    "div"
                );

            r2.className =
                "roll";


            r1.textContent =
                first===10
                ? "X"
                : (
                    first===undefined
                    ? ""
                    : first
                );


            if(
                first===10
            ){

                r2.textContent="";

            }
            else if(
                second!==undefined
            ){

                r2.textContent =
                    first+second===10
                    ? "/"
                    : second;

            }


            rollsEl.appendChild(
                r1
            );

            rollsEl.appendChild(
                r2
            );


            if(
                first===10
            ){

                index++;

            }
            else if(
                second!==undefined
            ){

                index+=2;

            }

        }

        /*
           10프레임
        */

        else{

            const r1 =
                document.createElement(
                    "div"
                );

            const r2 =
                document.createElement(
                    "div"
                );


            r1.className="roll";

            r2.className="roll";


            const a =
                rolls[index];

            const b =
                rolls[index+1];

            const c =
                rolls[index+2];


            r1.textContent =
                a===undefined
                ? ""
                : (
                    a===10
                    ? "X"
                    : a
                );


            r2.textContent =
                b===undefined
                ? ""
                : (
                    b===10
                    ? "X"
                    : (
                        a!==10 &&
                        a+b===10
                        ? "/"
                        : b
                    )
                );


            rollsEl.appendChild(
                r1
            );

            rollsEl.appendChild(
                r2
            );

        }


        frameEl.appendChild(
            rollsEl
        );


        const frameScore =
            document.createElement(
                "div"
            );


        frameScore.className =
            "frameScore";


        frameScore.textContent =
            scores[frame-1] ??
            "";


        frameEl.appendChild(
            frameScore
        );


        framesEl.appendChild(
            frameEl
        );

    }

}


/* =========================================================
   초기 화면
========================================================= */

updateScoreboard();


/* =========================================================
   페이지가 다시 보일 때 Wake Lock 재요청
========================================================= */

document.addEventListener(
    "visibilitychange",
    async ()=>{

        if(
            document.visibilityState==="visible" &&
            stream &&
            "wakeLock" in navigator
        ){

            try{

                await navigator.wakeLock.request(
                    "screen"
                );

            }catch(e){}

        }

    }
);

</script>
