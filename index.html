<body>

</tbody>

</div>


<div class="help">

    📱 아이폰은 위쪽 네모 거치대에 고정하세요.<br>

    핀을 손으로 다시 세우는 동안에는 점수를 기록하지 않습니다.<br>

    손이 빠지고 핀이 안정되면 자동으로 다음 투구를 준비합니다.<br>

    공을 굴리면 자동으로 움직임을 감지합니다.<br>

    공과 핀이 멈추면 자동으로 결과를 계산합니다.

</div>


<script>


/* =====================================================
   ELEMENT
===================================================== */

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("overlay");

const ctx =
    canvas.getContext("2d");

const statusEl =
    document.getElementById("status");

const fallenEl =
    document.getElementById("fallen");

const messageEl =
    document.getElementById("message");

const frameEl =
    document.getElementById("frame");

const throwEl =
    document.getElementById("throw");

const totalEl =
    document.getElementById("total");

const cameraButton =
    document.getElementById("cameraButton");


/* =====================================================
   GAME STATE
===================================================== */

let stream = null;

let cameraReady = false;

let running = false;


/*
   현재 게임 상태

   SETUP
   READY
   WAITING
   MOVING
   RESULT
*/

let state = "SETUP";


/*
   기준 이미지

   핀이 10개 모두 서 있을 때 저장
*/

let baselineImage = null;


/*
   이전 영상
*/

let previousImage = null;


/*
   움직임이 발생했는지
*/

let movementStarted = false;


/*
   안정된 프레임 수
*/

let stableFrames = 0;


/*
   핀 기준 상태가 몇 번 연속
   안정적으로 감지됐는지
*/

let setupStableFrames = 0;


/*
   자동 판정 중복 방지
*/

let resultLocked = false;


/*
   볼링 기록
*/

let rolls = [];


/* =====================================================
   핀 위치

   네 사진의 4-3-2-1 배열 기준

   x / y는 화면의 비율

===================================================== */

const PINS = [

    /* 뒤쪽 4개 */

    {
        x: 0.31,
        y: 0.29
    },

    {
        x: 0.48,
        y: 0.28
    },

    {
        x: 0.65,
        y: 0.28
    },

    {
        x: 0.80,
        y: 0.29
    },


    /* 가운데 3개 */

    {
        x: 0.39,
        y: 0.36
    },

    {
        x: 0.54,
        y: 0.36
    },

    {
        x: 0.69,
        y: 0.36
    },


    /* 앞쪽 2개 */

    {
        x: 0.46,
        y: 0.43
    },

    {
        x: 0.60,
        y: 0.43
    },


    /* 맨 앞 */

    {
        x: 0.53,
        y: 0.51
    }

];


/* =====================================================
   CAMERA
===================================================== */

async function startCamera() {

    if (cameraReady) {
        return;
    }

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                },

                audio: false

            });


        video.srcObject =
            stream;


        await video.play();


        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        cameraReady = true;


        cameraButton.style.display =
            "none";


        setStatus(
            "핀 10개를 세우는 중...",
            false
        );


        /*
           카메라가 안정된 후
           자동 감지 시작
        */

        setTimeout(
            startAutomaticSystem,
            1500
        );

    }

    catch(error) {

        console.error(error);

        alert(
            "카메라 권한이 필요합니다.\n\n" +
            "Safari에서 카메라 사용을 허용해주세요."
        );

    }

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
    text,
    ready = false
) {

    statusEl.textContent =
        text;

    statusEl.className =
        ready
        ? "status ready"
        : "status wait";

}


/* =====================================================
   FRAME CAPTURE
===================================================== */

function capture() {

    if (!cameraReady) {
        return null;
    }


    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    return ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );

}


/* =====================================================
   PIXEL SAMPLE
===================================================== */

function samplePixel(
    image,
    x,
    y
) {

    const index =
        (y * image.width + x) * 4;


    return {

        r:
            image.data[index],

        g:
            image.data[index + 1],

        b:
            image.data[index + 2]

    };

}


/* =====================================================
   PIN AREA ANALYSIS

   각 핀 주변의 밝기/어두움 분포를 계산한다.

   네 핀은 검은 테이프가 있으므로
   검은 영역을 이용한다.
===================================================== */

function analyzePin(
    image,
    pin
) {

    if (!image) {
        return null;
    }


    const width =
        image.width;

    const height =
        image.height;


    const centerX =
        Math.floor(
            pin.x * width
        );

    const centerY =
        Math.floor(
            pin.y * height
        );


    /*
       핀 하나의 분석 영역

       카메라가 위에서 내려다보는 구조라
       비교적 넓게 잡는다.
    */

    const rw =
        Math.floor(
            width * 0.075
        );

    const rh =
        Math.floor(
            height * 0.085
        );


    let dark = 0;

    let bright = 0;

    let total = 0;


    /*
       세로/가로 분포
    */

    let verticalDark = 0;

    let horizontalDark = 0;


    for (
        let y =
            centerY - rh;

        y <=
            centerY + rh;

        y += 4
    ) {


        for (
            let x =
                centerX - rw;

            x <=
                centerX + rw;

            x += 4
        ) {


            if (
                x < 0 ||
                x >= width ||
                y < 0 ||
                y >= height
            ) {
                continue;
            }


            const p =
                samplePixel(
                    image,
                    x,
                    y
                );


            const brightness =
                (
                    p.r +
                    p.g +
                    p.b
                ) / 3;


            total++;


            if (
                brightness < 80
            ) {

                dark++;

            }


            if (
                brightness > 170
            ) {

                bright++;

            }


            /*
               중심으로부터 거리
            */

            const dx =
                Math.abs(
                    x - centerX
                );

            const dy =
                Math.abs(
                    y - centerY
                );


            if (
                brightness < 80 &&
                dy > dx
            ) {

                verticalDark++;

            }


            if (
                brightness < 80 &&
                dx > dy
            ) {

                horizontalDark++;

            }

        }

    }


    if (total === 0) {
        return null;
    }


    return {

        darkRatio:
            dark / total,

        brightRatio:
            bright / total,

        verticalDark:
            verticalDark / total,

        horizontalDark:
            horizontalDark / total

    };

}


/* =====================================================
   ALL PINS ANALYSIS
===================================================== */

function analyzeAllPins(
    image
) {

    const result = [];

    for (
        let i = 0;
        i < PINS.length;
        i++
    ) {

        const data =
            analyzePin(
                image,
                PINS[i]
            );


        result.push({

            index: i,

            data: data

        });

    }


    return result;

}


/* =====================================================
   PIN DIFFERENCE
===================================================== */

function comparePins(
    baseline,
    current
) {

    if (
        !baseline ||
        !current
    ) {

        return null;

    }


    let fallen = 0;

    const results = [];


    for (
        let i = 0;
        i < PINS.length;
        i++
    ) {

        const a =
            baseline[i].data;

        const b =
            current[i].data;


        if (!a || !b) {
            continue;
        }


        /*
           변화량

           검은 테이프의 위치와
           밝은 핀의 면적이 바뀌면
           값이 크게 변한다.
        */

        const darkDifference =
            Math.abs(
                a.darkRatio -
                b.darkRatio
            );


        const verticalDifference =
            Math.abs(
                a.verticalDark -
                b.verticalDark
            );


        const horizontalDifference =
            Math.abs(
                a.horizontalDark -
                b.horizontalDark
            );


        /*
           쓰러진 핀의 특징:

           세로 구조 ↓
           가로 구조 ↑
        */

        const shapeChange =
            verticalDifference +
            horizontalDifference;


        let isFallen = false;


        /*
           기준 상태가 충분히
           핀처럼 보이는 경우에만 판정
        */

        if (
            darkDifference > 0.025 &&
            shapeChange > 0.018
        ) {

            isFallen = true;

        }


        /*
           세로 구조가 크게 사라진 경우
        */

        if (
            a.verticalDark > 0.025 &&
            b.verticalDark <
                a.verticalDark * 0.55
        ) {

            isFallen = true;

        }


        results.push({

            index: i,

            fallen: isFallen,

            difference:
                darkDifference,

            shape:
                shapeChange

        });


        if (isFallen) {
            fallen++;
        }

    }


    /*
       안전장치

       최대 10개
    */

    fallen =
        Math.max(
            0,
            Math.min(
                10,
                fallen
            )
        );


    return {

        fallen:
            fallen,

        pins:
            results

    };

}


/* =====================================================
   10개 핀이 서 있는지 판단
===================================================== */

function detectStandingPins(
    image
) {

    const analyzed =
        analyzeAllPins(
            image
        );


    let standing = 0;


    for (
        let i = 0;
        i < analyzed.length;
        i++
    ) {

        const data =
            analyzed[i].data;


        if (!data) {
            continue;
        }


        /*
           흰색 핀 + 검은 테이프가
           함께 존재하는 영역을
           서 있는 핀으로 판단
        */

        const looksLikePin =
            data.brightRatio > 0.20 &&
            data.darkRatio > 0.015;


        if (looksLikePin) {
            standing++;
        }

    }


    return {

        standing:
            standing,

        analyzed:
            analyzed

    };

}


/* =====================================================
   AUTOMATIC SYSTEM
===================================================== */

function startAutomaticSystem() {

    if (running) {
        return;
    }


    running = true;


    /*
       250ms마다 카메라 상태 확인
    */

    setInterval(
        automaticLoop,
        250
    );

}


/* =====================================================
   MAIN AUTOMATIC LOOP
===================================================== */

function automaticLoop() {

    if (!cameraReady) {
        return;
    }


    const image =
        capture();


    if (!image) {
        return;
    }


    /*
       SETUP

       핀을 손으로 세우는 단계
    */

    if (
        state === "SETUP"
    ) {

        handleSetup(
            image
        );

        return;

    }


    /*
       READY

       핀이 모두 서 있고
       공을 기다리는 단계
    */

    if (
        state === "READY"
    ) {

        handleReady(
            image
        );

        return;

    }


    /*
       MOVING

       공/핀 움직임 감지
    */

    if (
        state === "MOVING"
    ) {

        handleMoving(
            image
        );

        return;

    }


    /*
       RESULT

       결과를 표시하고
       핀을 다시 세우는 단계
    */

    if (
        state === "RESULT"
    ) {

        handleResult(
            image
        );

        return;

    }

}


/* =====================================================
   SETUP
===================================================== */

function handleSetup(
    image
) {

    const info =
        detectStandingPins(
            image
        );


    /*
       10개가 보여야 함
    */

    if (
        info.standing >= 9
    ) {

        setupStableFrames++;

        setStatus(
            "🎳 핀 10개 감지 중... " +
            setupStableFrames +
            "/8",
            false
        );


    } else {

        setupStableFrames = 0;


        setStatus(
            "핀을 모두 세워주세요. (" +
            info.standing +
            "/10)",
            false
        );

    }


    /*
       8번 연속 안정적으로
       9개 이상 감지되면
       자동 READY
    */

    if (
        setupStableFrames >= 8
    ) {

        baselineImage =
            analyzeAllPins(
                image
            );


        previousImage =
            image;


        state =
            "READY";


        movementStarted =
            false;


        stableFrames =
            0;


        resultLocked =
            false;


        setStatus(
            "🟢 READY — 공을 굴리세요!",
            true
        );


        messageEl.textContent =
            "공을 굴리세요!";

    }

}


/* =====================================================
   READY

   공이 움직이는지 기다림
===================================================== */

function handleReady(
    image
) {

    if (!previousImage) {

        previousImage =
            image;

        return;

    }


    const movement =
        calculateMovement(
            previousImage,
            image
        );


    previousImage =
        image;


    /*
       큰 움직임 발생

       공이 지나가거나
       핀이 움직인 것
    */

    if (
        movement > 0.018
    ) {

        movementStarted =
            true;

        stableFrames =
            0;

        state =
            "MOVING";


        setStatus(
            "🎳 투구 감지!",
            true
        );

    }

}


/* =====================================================
   MOVING
===================================================== */

function handleMoving(
    image
) {

    if (!previousImage) {

        previousImage =
            image;

        return;

    }


    const movement =
        calculateMovement(
            previousImage,
            image
        );


    previousImage =
        image;


    if (
        movement > 0.018
    ) {

        stableFrames = 0;

        return;

    }


    /*
       움직임이 사라짐
    */

    stableFrames++;


    setStatus(
        "핀 정지 확인 중...",
        false
    );


    /*
       약 2초 안정
    */

    if (
        stableFrames >= 8
    ) {

        automaticResult(
            image
        );

    }

}


/* =====================================================
   RESULT
===================================================== */

function handleResult(
    image
) {

    /*
       결과 직후에는
       손으로 핀을 세우는 중일 수 있음.

       움직임이 발생하면
       다시 SETUP으로 전환.
    */

    if (!previousImage) {

        previousImage =
            image;

        return;

    }


    const movement =
        calculateMovement(
            previousImage,
            image
        );


    previousImage =
        image;


    if (
        movement > 0.025
    ) {

        /*
           손으로 핀을 다시 세우기 시작
        */

        state =
            "SETUP";


        setupStableFrames =
            0;


        setStatus(
            "핀을 다시 세우는 중...",
            false
        );

    }

}


/* =====================================================
   AUTOMATIC RESULT
===================================================== */

function automaticResult(
    image
) {

    if (resultLocked) {
        return;
    }


    resultLocked =
        true;


    const current =
        analyzeAllPins(
            image
        );


    const result =
        comparePins(
            baselineImage,
            current
        );


    if (!result) {

        resultLocked =
            false;

        return;

    }


    const fallen =
        result.fallen;


    /*
       결과 표시
    */

    fallenEl.textContent =
        fallen;


    /*
       기록
    */

    addRoll(
        fallen
    );


    /*
       메시지
    */

    if (
        fallen === 10
    ) {

        messageEl.textContent =
            "🔥 STRIKE!";

    }

    else {

        const index =
            rolls.length - 1;


        /*
           두 번째 투구에서
           총 10이면 SPARE
        */

        if (
            index >= 1 &&
            rolls[index - 1] +
            rolls[index] === 10
        ) {

            messageEl.textContent =
                "✨ SPARE!";

        }

        else {

            messageEl.textContent =
                fallen +
                "개 쓰러짐";

        }

    }


    /*
       RESULT 상태

       이제 손으로 핀을
       다시 세울 수 있다.
    */

    state =
        "RESULT";


    previousImage =
        image;


    setStatus(
        "결과: " +
        fallen +
        "개 쓰러짐 — 핀을 다시 세워주세요.",
        false
    );


    updateGameInfo();

}


/* =====================================================
   MOVEMENT
===================================================== */

function calculateMovement(
    a,
    b
) {

    if (!a || !b) {
        return 0;
    }


    const dataA =
        a.data;

    const dataB =
        b.data;


    const step =
        16;


    let changed =
        0;

    let total =
        0;


    for (
        let i = 0;
        i < dataA.length;
        i += 4 * step
    ) {

        const r =
            Math.abs(
                dataA[i] -
                dataB[i]
            );


        const g =
            Math.abs(
                dataA[i + 1] -
                dataB[i + 1]
            );


        const bl =
            Math.abs(
                dataA[i + 2] -
                dataB[i + 2]
            );


        const difference =
            (
                r +
                g +
                bl
            ) / 3;


        if (
            difference > 30
        ) {

            changed++;

        }


        total++;

    }


    if (!total) {
        return 0;
    }


    return changed / total;

}


/* =====================================================
   ADD ROLL
===================================================== */

function addRoll(
    value
) {

    /*
       정상 게임은
       최대 21구
    */

    if (
        rolls.length >= 21
    ) {

        return;

    }


    rolls.push(
        value
    );


    updateScoreboard();


    updateGameInfo();

}


/* =====================================================
   BOWLING SCORE
===================================================== */

function calculateScores(
    rolls
) {

    const scores = [];

    let index = 0;

    let total = 0;


    for (
        let frame = 0;
        frame < 10;
        frame++
    ) {


        if (
            rolls[index] === undefined
        ) {

            break;

        }


        const first =
            rolls[index];


        /*
           STRIKE
        */

        if (
            first === 10
        ) {

            if (
                rolls[index + 1] === undefined ||
                rolls[index + 2] === undefined
            ) {

                break;

            }


            total +=
                10 +
                rolls[index + 1] +
                rolls[index + 2];


            scores.push(
                total
            );


            index += 1;


            continue;

        }


        /*
           두 번째 구 필요
        */

        if (
            rolls[index + 1] === undefined
        ) {

            break;

        }


        const second =
            rolls[index + 1];


        /*
           SPARE
        */

        if (
            first + second === 10
        ) {

            if (
                rolls[index + 2] === undefined
            ) {

                break;

            }


            total +=
                10 +
                rolls[index + 2];

        }


        else {

            total +=
                first +
                second;

        }


        scores.push(
            total
        );


        index += 2;

    }


    return scores;

}


/* =====================================================
   SCOREBOARD
===================================================== */

function updateScoreboard() {

    const body =
        document.getElementById(
            "scoreBody"
        );


    body.innerHTML = "";


    const scores =
        calculateScores(
            rolls
        );


    let rollIndex = 0;


    for (
        let frame = 1;
        frame <= 10;
        frame++
    ) {


        let first = "";

        let second = "";


        if (
            rolls[rollIndex] !== undefined
        ) {

            first =
                rolls[rollIndex];

        }


        /*
           STRIKE
        */

        if (
            first === 10
        ) {

            second = "";

            rollIndex++;

        }


        else {

            if (
                rolls[rollIndex + 1] !== undefined
            ) {

                second =
                    rolls[
                        rollIndex + 1
                    ];

            }


            if (
                first !== "" &&
                second !== ""
            ) {

                rollIndex += 2;

            }

        }


        const score =
            scores[frame - 1] !== undefined
            ? scores[frame - 1]
            : "";


        const row =
            document.createElement(
                "tr"
            );


        row.innerHTML = `

            <td>${frame}</td>

            <td>${first}</td>

            <td>${second}</td>

            <td>${score}</td>

        `;


        body.appendChild(
            row
        );

    }


    /*
       총점
    */

    if (
        scores.length > 0
    ) {

        totalEl.textContent =
            scores[
                scores.length - 1
            ];

    }

}


/* =====================================================
   GAME INFO
===================================================== */

function updateGameInfo() {

    let frame = 1;

    let throwNumber = 1;


    let index = 0;


    while (
        index < rolls.length &&
        frame <= 10
    ) {

        if (
            rolls[index] === 10
        ) {

            frame++;

            index++;

        }

        else if (
            rolls[index + 1] !== undefined
        ) {

            frame++;

            index += 2;

        }

        else {

            throwNumber = 2;

            break;

        }

    }


    /*
       현재 프레임 계산
    */

    if (
        rolls.length > 0
    ) {

        const last =
            rolls[
                rolls.length - 1
            ];


        if (
            last !== 10 &&
            rolls.length >= 2 &&
            (
                rolls[
                    rolls.length - 2
                ] + last
            ) < 10
        ) {

            throwNumber = 1;

        }

    }


    frameEl.textContent =
        Math.min(
            frame,
            10
        );


    throwEl.textContent =
        throwNumber;

}


/* =====================================================
   INITIAL
===================================================== */

updateScoreboard();

updateGameInfo();


</script>
