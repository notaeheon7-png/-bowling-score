<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Mini Bowling Auto Score</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#050505;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    text-align:center;
}

#camera{
    display:none;
}

#analysisCanvas{
    display:none;
}

.container{
    width:94%;
    max-width:700px;
    margin:auto;
}

.title{
    margin-top:28px;
    font-size:28px;
    font-weight:900;
}

.subtitle{
    color:#888;
    margin-top:4px;
    font-size:12px;
}

.status{
    margin:22px auto 12px;
    padding:13px;
    border-radius:14px;
    background:#171717;
    color:#aaa;
    font-size:15px;
}

.status.ready{
    background:#073c22;
    color:#53ed91;
}

.status.play{
    background:#102b4c;
    color:#63b6ff;
}

.score{
    margin-top:15px;
    padding:22px 15px;
    border-radius:22px;
    background:#141414;
}

.small{
    color:#888;
    font-size:13px;
}

.big{
    font-size:64px;
    line-height:1.05;
    font-weight:900;
    margin:5px 0;
}

.total{
    font-size:36px;
    font-weight:900;
}

.info{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.box{
    flex:1;
    background:#151515;
    border-radius:14px;
    padding:13px 5px;
}

.label{
    color:#777;
    font-size:11px;
}

.value{
    margin-top:4px;
    font-size:22px;
    font-weight:800;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
    background:#101010;
}

th,td{
    border:1px solid #333;
    padding:10px 5px;
}

th{
    background:#222;
    font-size:13px;
}

td{
    font-size:14px;
}

.current{
    outline:2px solid #2d8cff;
}

.message{
    margin-top:14px;
    font-size:20px;
    font-weight:900;
}

.start{
    margin-top:20px;
    padding:15px 25px;
    border:0;
    border-radius:15px;
    background:#1677ff;
    color:white;
    font-size:17px;
    font-weight:800;
}

.start.hidden{
    display:none;
}

.help{
    margin:25px auto;
    color:#666;
    font-size:12px;
    line-height:1.7;
}
</style>
</head>

<body>

<!--
    실제 카메라 영상은 화면에 표시하지 않는다.
    후면 카메라 프레임을 내부 분석에만 사용한다.
-->

<video
    id="camera"
    autoplay
    playsinline
    muted>
</video>

<canvas id="analysisCanvas"></canvas>


<div class="container">

    <div class="title">
        🎳 MINI BOWLING
    </div>

    <div class="subtitle">
        AUTOMATIC SCOREBOARD
    </div>


    <div
        id="status"
        class="status">

        카메라를 시작해주세요.

    </div>


    <!-- 최초 1회 카메라 권한 -->
    <button
        id="startButton"
        class="start"
        onclick="startSystem()">

        📷 게임 시작

    </button>


    <div class="score">

        <div class="small">
            최근 투구
        </div>

        <div
            id="lastScore"
            class="big">

            -

        </div>

        <div class="small">
            쓰러진 핀
        </div>

        <div
            id="message"
            class="message">

            핀을 세워주세요.

        </div>

    </div>


    <div class="info">

        <div class="box">

            <div class="label">
                FRAME
            </div>

            <div
                id="frame"
                class="value">
                1
            </div>

        </div>


        <div class="box">

            <div class="label">
                THROW
            </div>

            <div
                id="throw"
                class="value">
                1
            </div>

        </div>


        <div class="box">

            <div class="label">
                TOTAL
            </div>

            <div
                id="total"
                class="total">
                0
            </div>

        </div>

    </div>


    <table>

        <thead>

            <tr>
                <th>FRAME</th>
                <th>1구</th>
                <th>2구</th>
                <th>SCORE</th>
            </tr>

        </thead>

        <tbody id="scoreBody">

        </tbody>

    </table>


    <div class="help">

        📱 아이폰은 미니 볼링판 위쪽 네모 거치대에 고정하세요.<br>
        후면 카메라는 화면에 표시되지 않습니다.<br>
        핀을 손으로 세우는 동안 자동으로 대기합니다.<br>
        핀이 안정되면 자동으로 READY가 됩니다.<br>
        공을 굴리면 자동으로 투구를 감지합니다.<br>
        핀이 멈추면 자동으로 점수를 계산합니다.

    </div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("analysisCanvas");

const ctx =
    canvas.getContext("2d");

const statusEl =
    document.getElementById("status");

const startButton =
    document.getElementById("startButton");

const lastScoreEl =
    document.getElementById("lastScore");

const messageEl =
    document.getElementById("message");

const frameEl =
    document.getElementById("frame");

const throwEl =
    document.getElementById("throw");

const totalEl =
    document.getElementById("total");

const scoreBody =
    document.getElementById("scoreBody");


/* =====================================================
   STATE
===================================================== */

let stream = null;

let cameraReady = false;

let state = "SETUP";

let baseline = null;

let previousFrame = null;

let stableCounter = 0;

let setupCounter = 0;

let movementCounter = 0;

let resultLock = false;

let rolls = [];


/*
   상태

   SETUP
   = 핀을 세우는 중

   READY
   = 공을 기다림

   MOVING
   = 공/핀이 움직이는 중

   RESULT
   = 결과 확인 후 핀 재설치 대기
*/


/* =====================================================
   PIN POSITIONS
   사진의 4-3-2-1 배치 기준
===================================================== */

const PINS = [

    {x:0.31,y:0.29},
    {x:0.48,y:0.28},
    {x:0.65,y:0.28},
    {x:0.80,y:0.29},

    {x:0.39,y:0.36},
    {x:0.54,y:0.36},
    {x:0.69,y:0.36},

    {x:0.46,y:0.43},
    {x:0.60,y:0.43},

    {x:0.53,y:0.51}

];


/* =====================================================
   STATUS
===================================================== */

function status(
    text,
    type=""
){

    statusEl.textContent =
        text;

    statusEl.className =
        "status " + type;

}


/* =====================================================
   CAMERA START
===================================================== */

async function startSystem(){

    try{

        /*
           후면 카메라 요청
        */

        stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        exact:"environment"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }
                },

                audio:false

            });


        video.srcObject =
            stream;


        await video.play();


        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        cameraReady =
            true;


        startButton.classList.add(
            "hidden"
        );


        status(
            "핀 10개를 세워주세요.",
            ""
        );


        /*
           카메라 안정화
        */

        setTimeout(
            mainLoop,
            1000
        );

    }

    catch(error){

        console.error(error);

        /*
           일부 Safari에서는 exact environment가
           실패할 수 있으므로 일반 후면 카메라로 재시도
        */

        try{

            stream =
                await navigator.mediaDevices.getUserMedia({

                    video:{
                        facingMode:"environment"
                    },

                    audio:false

                });


            video.srcObject =
                stream;

            await video.play();


            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;


            cameraReady =
                true;


            startButton.classList.add(
                "hidden"
            );


            status(
                "핀 10개를 세워주세요.",
                ""
            );


            setTimeout(
                mainLoop,
                1000
            );

        }

        catch(error2){

            alert(
                "후면 카메라를 사용할 수 없습니다.\n\n" +
                "Safari의 카메라 권한을 확인해주세요."
            );

        }

    }

}


/* =====================================================
   CAPTURE
===================================================== */

function capture(){

    if(!cameraReady){
        return null;
    }


    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    return ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );

}


/* =====================================================
   MOVEMENT DETECTION
===================================================== */

function movement(
    a,
    b
){

    if(!a || !b){
        return 0;
    }


    let changed = 0;

    let total = 0;


    /*
       전체 화면을 모두 계산하지 않고
       일정 간격으로 샘플링
    */

    const step = 20;


    for(
        let i=0;
        i<a.data.length;
        i+=4*step
    ){

        const r =
            Math.abs(
                a.data[i] -
                b.data[i]
            );

        const g =
            Math.abs(
                a.data[i+1] -
                b.data[i+1]
            );

        const blue =
            Math.abs(
                a.data[i+2] -
                b.data[i+2]
            );


        const diff =
            (r+g+blue)/3;


        if(diff > 35){
            changed++;
        }


        total++;

    }


    return total
        ? changed/total
        : 0;

}


/* =====================================================
   PIN ANALYSIS
===================================================== */

function pinFeatures(
    image,
    pin
){

    const w =
        image.width;

    const h =
        image.height;


    const cx =
        Math.floor(
            pin.x*w
        );

    const cy =
        Math.floor(
            pin.y*h
        );


    const rx =
        Math.floor(
            w*0.065
        );

    const ry =
        Math.floor(
            h*0.075
        );


    let dark = 0;

    let bright = 0;

    let total = 0;

    let vertical = 0;

    let horizontal = 0;


    for(
        let y=cy-ry;
        y<=cy+ry;
        y+=4
    ){

        for(
            let x=cx-rx;
            x<=cx+rx;
            x+=4
        ){

            if(
                x<0 ||
                x>=w ||
                y<0 ||
                y>=h
            ){
                continue;
            }


            const i =
                (y*w+x)*4;


            const r =
                image.data[i];

            const g =
                image.data[i+1];

            const b =
                image.data[i+2];


            const brightness =
                (r+g+b)/3;


            total++;


            if(
                brightness<80
            ){
                dark++;
            }


            if(
                brightness>170
            ){
                bright++;
            }


            const dx =
                Math.abs(
                    x-cx
                );

            const dy =
                Math.abs(
                    y-cy
                );


            if(
                brightness<80 &&
                dy>dx
            ){
                vertical++;
            }


            if(
                brightness<80 &&
                dx>dy
            ){
                horizontal++;
            }

        }

    }


    return {

        dark:
            dark/total,

        bright:
            bright/total,

        vertical:
            vertical/total,

        horizontal:
            horizontal/total

    };

}


/* =====================================================
   ALL PIN FEATURES
===================================================== */

function allPins(
    image
){

    return PINS.map(
        pin =>
            pinFeatures(
                image,
                pin
            )
    );

}


/* =====================================================
   STANDING PINS
===================================================== */

function standingPins(
    image
){

    const features =
        allPins(image);


    let count = 0;


    for(
        const f of features
    ){

        /*
           흰색 핀 + 검은 테이프
        */

        if(
            f.bright > 0.20 &&
            f.dark > 0.015
        ){

            count++;

        }

    }


    return {

        count,
        features

    };

}


/* =====================================================
   RESULT
===================================================== */

function compare(
    before,
    after
){

    let fallen = 0;


    for(
        let i=0;
        i<PINS.length;
        i++
    ){

        const a =
            before[i];

        const b =
            after[i];


        const darkDiff =
            Math.abs(
                a.dark-b.dark
            );


        const verticalDiff =
            Math.abs(
                a.vertical-b.vertical
            );


        const horizontalDiff =
            Math.abs(
                a.horizontal-b.horizontal
            );


        const shape =
            verticalDiff+
            horizontalDiff;


        let down = false;


        /*
           핀 쓰러짐 판정
        */

        if(
            darkDiff>0.025 &&
            shape>0.018
        ){

            down = true;

        }


        if(
            a.vertical>0.025 &&
            b.vertical<
                a.vertical*0.55
        ){

            down = true;

        }


        if(down){
            fallen++;
        }

    }


    return Math.max(
        0,
        Math.min(
            10,
            fallen
        )
    );

}


/* =====================================================
   MAIN LOOP
===================================================== */

function mainLoop(){

    if(!cameraReady){
        return;
    }


    const current =
        capture();


    if(!current){

        requestAnimationFrame(
            mainLoop
        );

        return;

    }


    /* ================================================
       SETUP
    ================================================= */

    if(
        state==="SETUP"
    ){

        const pins =
            standingPins(
                current
            );


        if(
            pins.count>=9
        ){

            setupCounter++;


            status(
                "핀 안정화 중... "+
                setupCounter+
                "/8"
            );

        }

        else{

            setupCounter=0;


            status(
                "핀을 세워주세요. "+
                "("+
                pins.count+
                "/10)"
            );

        }


        /*
           8번 연속 감지
        */

        if(
            setupCounter>=8
        ){

            baseline =
                allPins(
                    current
                );


            previousFrame =
                current;


            state =
                "READY";


            stableCounter=0;


            status(
                "🟢 READY — 공을 굴리세요!",
                "ready"
            );


            messageEl.textContent =
                "공을 굴리세요.";

        }

    }


    /* ================================================
       READY
    ================================================= */

    else if(
        state==="READY"
    ){

        const m =
            movement(
                previousFrame,
                current
            );


        previousFrame =
            current;


        if(
            m>0.018
        ){

            state =
                "MOVING";


            movementCounter=0;


            status(
                "🎳 투구 감지!",
                "play"
            );

        }

    }


    /* ================================================
       MOVING
    ================================================= */

    else if(
        state==="MOVING"
    ){

        const m =
            movement(
                previousFrame,
                current
            );


        previousFrame =
            current;


        if(
            m>0.018
        ){

            movementCounter=0;

        }

        else{

            movementCounter++;

        }


        /*
           움직임이 약 2초 멈춤
        */

        if(
            movementCounter>=8 &&
            !resultLock
        ){

            resultLock=true;


            const after =
                allPins(
                    current
                );


            const fallen =
                compare(
                    baseline,
                    after
                );


            processResult(
                fallen
            );

        }

    }


    /* ================================================
       RESULT
    ================================================= */

    else if(
        state==="RESULT"
    ){

        const m =
            movement(
                previousFrame,
                current
            );


        previousFrame =
            current;


        /*
           손으로 핀을 다시 세우기 시작
        */

        if(
            m>0.025
        ){

            state =
                "SETUP";


            setupCounter=0;

            resultLock=false;


            status(
                "핀을 다시 세우는 중..."
            );

        }

    }


    requestAnimationFrame(
        mainLoop
    );

}


/* =====================================================
   PROCESS RESULT
===================================================== */

function processResult(
    fallen
){

    lastScoreEl.textContent =
        fallen;


    rolls.push(
        fallen
    );


    if(
        fallen===10
    ){

        messageEl.textContent =
            "🔥 STRIKE!";

    }

    else if(
        rolls.length>=2 &&
        rolls[rolls.length-2]+
        rolls[rolls.length-1]===10
    ){

        messageEl.textContent =
            "✨ SPARE!";

    }

    else{

        messageEl.textContent =
            fallen+
            "개 쓰러짐";

    }


    updateScore();


    state =
        "RESULT";


    resultLock=false;


    status(
        "결과: "+
        fallen+
        "개 — 핀을 다시 세워주세요."
    );

}


/* =====================================================
   SCORE CALCULATION
===================================================== */

function calculateScores(){

    const scores=[];

    let index=0;

    let total=0;


    for(
        let frame=0;
        frame<10;
        frame++
    ){

        if(
            rolls[index]===undefined
        ){
            break;
        }


        const first =
            rolls[index];


        /*
           STRIKE
        */

        if(
            first===10
        ){

            if(
                rolls[index+1]===undefined ||
                rolls[index+2]===undefined
            ){
                break;
            }


            total +=
                10+
                rolls[index+1]+
                rolls[index+2];


            scores.push(
                total
            );


            index++;

            continue;

        }


        if(
            rolls[index+1]===undefined
        ){
            break;
        }


        const second =
            rolls[index+1];


        /*
           SPARE
        */

        if(
            first+second===10
        ){

            if(
                rolls[index+2]===undefined
            ){
                break;
            }


            total +=
                10+
                rolls[index+2];

        }

        else{

            total +=
                first+
                second;

        }


        scores.push(
            total
        );


        index+=2;

    }


    return scores;

}


/* =====================================================
   SCOREBOARD
===================================================== */

function updateScore(){

    scoreBody.innerHTML="";


    const scores =
        calculateScores();


    let index=0;


    for(
        let frame=1;
        frame<=10;
        frame++
    ){

        let first="";

        let second="";


        if(
            rolls[index]!==undefined
        ){

            first =
                rolls[index];

        }


        if(
            first===10
        ){

            index++;

        }

        else{

            if(
                rolls[index+1]!==undefined
            ){

                second =
                    rolls[index+1];

                index+=2;

            }

        }


        const score =
            scores[frame-1]??"";


        const tr =
            document.createElement(
                "tr"
            );


        tr.innerHTML=`

            <td>${frame}</td>

            <td>${first}</td>

            <td>${second}</td>

            <td>${score}</td>

        `;


        scoreBody.appendChild(
            tr
        );

    }


    if(
        scores.length
    ){

        totalEl.textContent =
            scores[
                scores.length-1
            ];

    }


    updateInfo();

}


/* =====================================================
   FRAME / THROW
===================================================== */

function updateInfo(){

    let frame=1;

    let throwNumber=1;

    let index=0;


    while(
        index<rolls.length &&
        frame<=10
    ){

        if(
            rolls[index]===10
        ){

            frame++;

            index++;

        }

        else if(
            rolls[index+1]!==undefined
        ){

            frame++;

            index+=2;

        }

        else{

            throwNumber=2;

            break;

        }

    }


    frameEl.textContent =
        Math.min(
            frame,
            10
        );


    throwEl.textContent =
        throwNumber;

}


/* =====================================================
   INITIAL
===================================================== */

updateScore();

updateInfo();

</script>

</body>
</html>
