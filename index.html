<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>Mini Bowling Automatic</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #07111f;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app {
    width: 100%;
    max-width: 700px;
    min-height: 100vh;
    padding: 22px 16px 30px;
    display: flex;
    flex-direction: column;
}

.header {
    text-align: center;
    margin-bottom: 15px;
}

.title {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 2px;
}

.subtitle {
    margin-top: 5px;
    font-size: 12px;
    opacity: .55;
}

.statusBox {
    margin-top: 15px;
    background: #101d30;
    border: 1px solid #203451;
    border-radius: 18px;
    padding: 16px;
    text-align: center;
}

.status {
    font-size: 20px;
    font-weight: 900;
}

.detail {
    margin-top: 6px;
    font-size: 12px;
    opacity: .65;
    min-height: 18px;
}

.startButton {
    width: 100%;
    border: 0;
    border-radius: 18px;
    margin-top: 15px;
    padding: 17px;
    font-size: 18px;
    font-weight: 900;
    background: #ffffff;
    color: #07111f;
}

.startButton:active {
    transform: scale(.98);
}

.hidden {
    display: none !important;
}

/* 현재 투구 */

.current {
    margin-top: 15px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.card {
    background: #101d30;
    border: 1px solid #203451;
    border-radius: 18px;
    padding: 16px;
    text-align: center;
}

.cardLabel {
    font-size: 11px;
    opacity: .55;
    margin-bottom: 7px;
}

.cardValue {
    font-size: 30px;
    font-weight: 950;
}

.bigResult {
    margin-top: 15px;
    background: #101d30;
    border: 1px solid #203451;
    border-radius: 22px;
    padding: 20px;
    text-align: center;
}

.resultText {
    font-size: 31px;
    font-weight: 950;
}

.resultSub {
    margin-top: 5px;
    font-size: 13px;
    opacity: .6;
}

/* 총점 */

.totalBox {
    margin-top: 15px;
    background: #101d30;
    border: 1px solid #203451;
    border-radius: 22px;
    padding: 20px;
    text-align: center;
}

.totalLabel {
    font-size: 12px;
    opacity: .55;
}

.totalScore {
    margin-top: 4px;
    font-size: 58px;
    line-height: 1;
    font-weight: 950;
}

/* 프레임 */

.frames {
    margin-top: 15px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
}

.frame {
    min-height: 86px;
    background: #101d30;
    border: 1px solid #203451;
    border-radius: 13px;
    overflow: hidden;
}

.frame.active {
    border-color: white;
}

.frameNumber {
    background: #172941;
    padding: 5px;
    text-align: center;
    font-size: 10px;
    opacity: .75;
}

.rolls {
    height: 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 1px solid #203451;
}

.roll {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 13px;
    font-weight: 900;
    border-right: 1px solid #203451;
}

.roll:last-child {
    border-right: 0;
}

.frameScore {
    height: 37px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 900;
}

/* 10프레임 */

.frame.tenth .rolls {
    grid-template-columns: 1fr 1fr 1fr;
}

/* 핀 상태 */

.pinPanel {
    margin-top: 15px;
    background: #101d30;
    border: 1px solid #203451;
    border-radius: 22px;
    padding: 17px;
}

.pinTitle {
    text-align: center;
    font-size: 11px;
    opacity: .55;
    margin-bottom: 13px;
}

.pinGrid {
    width: 170px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.pinRow {
    display: flex;
    justify-content: center;
    gap: 9px;
}

.pin {
    width: 25px;
    height: 25px;
    border-radius: 50%;
    background: #263a55;
    border: 2px solid #49617f;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 9px;
    font-weight: 900;
}

.pin.standing {
    background: #ffffff;
    color: #07111f;
    border-color: #ffffff;
}

.pin.down {
    background: #26303c;
    color: #738196;
    border-color: #34465d;
}

/*
카메라 화면은 절대 보이지 않음.
video를 완전히 화면 밖으로 이동하지만
브라우저가 카메라 스트림을 계속 유지하도록 함.
*/

#camera {
    position: fixed;
    left: -2000px;
    top: -2000px;
    width: 2px;
    height: 2px;
    opacity: 0.001;
    pointer-events: none;
}

#processor {
    position: fixed;
    left: -2000px;
    top: -2000px;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
}

.footer {
    margin-top: auto;
    padding-top: 18px;
    text-align: center;
    font-size: 10px;
    opacity: .35;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="title">🎳 MINI BOWLING</div>
        <div class="subtitle">

        </div>
    </div>

    <div class="statusBox">
        <div id="status" class="status">

        </div>

        </div>

        <button
            id="startButton"
            class="startButton">

        </button>
    </div>

    <div class="current">

        <div class="card">

            </div>
        </div>

        <div class="card">
            <div class="cardLabel">BALL</div>

            </div>

    </div>

    <div class="bigResult">

        <div id="resultText" class="resultText">

        </div>

        <div id="resultSub" class="resultSub">

        </div>

    </div>

    <div class="totalBox">

        <div class="totalLabel">
            TOTAL SCORE
        </div>

        <div id="totalScore" class="totalScore">
            0
        </div>

    </div>

    <div id="frames" class="frames"></div>

    <div class="pinPanel">

        <div class="pinTitle">
            PIN STATUS
        </div>

        <div class="pinGrid">

            <div class="pinRow">
                <div class="pin" id="pin0">1</div>
                <div class="pin" id="pin1">2</div>
                <div class="pin" id="pin2">3</div>
                <div class="pin" id="pin3">4</div>
            </div>

            <div class="pinRow">
                <div class="pin" id="pin4">5</div>
                <div class="pin" id="pin5">6</div>
                <div class="pin" id="pin6">7</div>
            </div>

            <div class="pinRow">
                <div class="pin" id="pin7">8</div>
                <div class="pin" id="pin8">9</div>
            </div>

            <div class="pinRow">
                <div class="pin" id="pin9">10</div>
            </div>

        </div>

    </div>

    <div class="footer">
        CAMERA HIDDEN · AUTOMATIC DETECTION
    </div>

</div>


<video
    id="camera"
    autoplay
    muted
    playsinline>
</video>

<canvas
    id="processor"
    width="360"
    height="480">
</canvas>


<script>

/* =========================================================
   MINI BOWLING AUTOMATIC SYSTEM
   현재 사용자가 보내준 탑뷰 사진 기준
   ========================================================= */


/* ---------------------------------------------------------
   기본 설정
--------------------------------------------------------- */

const CONFIG = {

    /*
       실제 처리 해상도.
       너무 높이면 아이폰에서 무거워지므로
       360 x 480으로 처리.
    */

    WIDTH: 360,
    HEIGHT: 480,

    /*
       약 0.15~0.20초마다 카메라 분석
    */

    INTERVAL: 170,

    /*
       현재 사진 기준 핀 위치.

       4
       3
       2
       1
    */

    PINS: [

        // 1~4
        { x: 0.285, y: 0.205 },
        { x: 0.420, y: 0.205 },
        { x: 0.550, y: 0.205 },
        { x: 0.680, y: 0.205 },

        // 5~7
        { x: 0.350, y: 0.335 },
        { x: 0.495, y: 0.335 },
        { x: 0.625, y: 0.335 },

        // 8~9
        { x: 0.425, y: 0.475 },
        { x: 0.565, y: 0.475 },

        // 10
        { x: 0.505, y: 0.625 }
    ],

    /*
       핀 분석 영역
    */

    PIN_RX: 0.060,
    PIN_RY: 0.070,

    /*
       공이 굴러오는 영역.

       화면 아래쪽에서 위쪽으로
       공이 움직이는 것을 찾음.
    */

    BALL_ROI: {
        x: 0.12,
        y: 0.55,
        w: 0.76,
        h: 0.42
    },

    /*
       핀이 움직이는 전체 영역
    */

    BOARD_ROI: {
        x: 0.08,
        y: 0.10,
        w: 0.84,
        h: 0.82
    },

    /*
       움직임 시작 기준
    */

    MOTION_START: 0.018,

    /*
       움직임이 멈췄다고 판단하는 기준
    */

    MOTION_STOP: 0.009,

    /*
       연속으로 움직임이 있어야 실제 투구로 판단
    */

    MOTION_START_FRAMES: 2,

    /*
       이 정도 프레임 동안 움직임이 없어야
       투구가 끝났다고 판단
    */

    MOTION_STOP_FRAMES: 9,

    /*
       핀 위치가 안정된 시간
    */

    SETUP_STABLE_FRAMES: 12,

    RESET_STABLE_FRAMES: 13,

    /*
       핀 이미지 변화 기준.

       카메라가 고정되어 있을수록
       이 값이 잘 작동함.
    */

    FALL_THRESHOLD: 0.115,

    /*
       서 있는 핀 확인 기준
    */

    STANDING_THRESHOLD: 0.115,

    /*
       너무 어둡거나 너무 밝은 영역을
       핀으로 잘못 인식하지 않도록 함.
    */

    DARK_LIMIT: 95,
    BRIGHT_LIMIT: 175
};


/* ---------------------------------------------------------
   DOM
--------------------------------------------------------- */

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("processor");

const ctx =
    canvas.getContext("2d", {
        willReadFrequently: true
    });

const statusEl =
    document.getElementById("status");

const detailEl =
    document.getElementById("detail");

const resultTextEl =
    document.getElementById("resultText");

const resultSubEl =
    document.getElementById("resultSub");

const totalScoreEl =
    document.getElementById("totalScore");

const frameTextEl =
    document.getElementById("frameText");

const ballTextEl =
    document.getElementById("ballText");

const startButton =
    document.getElementById("startButton");


/* ---------------------------------------------------------
   게임 상태
--------------------------------------------------------- */

let stream = null;

let running = false;

let state = "WAITING";

let timer = null;

let previousImage = null;

let baselineImage = null;

let standingTemplate = [];

let baselineTemplate = [];

let currentPinCenters = [];

let activePins = Array.from(
    { length: 10 },
    (_, i) => i
);

let requiredPins = Array.from(
    { length: 10 },
    (_, i) => i
);

let motionStartCount = 0;

let motionStopCount = 0;

let setupStableCount = 0;

let resetStableCount = 0;

let rolls = [];

let gameFrame = 1;

let ballNumber = 1;

let lastResult = 0;


/* ---------------------------------------------------------
   유틸
--------------------------------------------------------- */

function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
}

function pxX(v) {
    return Math.round(
        v * CONFIG.WIDTH
    );
}

function pxY(v) {
    return Math.round(
        v * CONFIG.HEIGHT
    );
}


/* ---------------------------------------------------------
   상태 표시
--------------------------------------------------------- */

function setStatus(
    title,
    detail = ""
) {

    statusEl.textContent = title;

    detailEl.textContent = detail;
}


/* ---------------------------------------------------------
   이미지 캡처
--------------------------------------------------------- */

function captureFrame() {

    ctx.drawImage(
        video,
        0,
        0,
        CONFIG.WIDTH,
        CONFIG.HEIGHT
    );

    return ctx.getImageData(
        0,
        0,
        CONFIG.WIDTH,
        CONFIG.HEIGHT
    );
}


/* ---------------------------------------------------------
   픽셀 밝기
--------------------------------------------------------- */

function brightness(
    data,
    x,
    y
) {

    const xx =
        clamp(
            Math.round(x),
            0,
            CONFIG.WIDTH - 1
        );

    const yy =
        clamp(
            Math.round(y),
            0,
            CONFIG.HEIGHT - 1
        );

    const index =
        (yy * CONFIG.WIDTH + xx) * 4;

    const r = data[index];

    const g = data[index + 1];

    const b = data[index + 2];

    return (
        0.299 * r +
        0.587 * g +
        0.114 * b
    );
}


/* ---------------------------------------------------------
   작은 패치 추출

   핀 하나의 모습을 숫자로 저장한다.
--------------------------------------------------------- */

function extractPatch(
    image,
    cx,
    cy
) {

    const rx =
        CONFIG.PIN_RX *
        CONFIG.WIDTH;

    const ry =
        CONFIG.PIN_RY *
        CONFIG.HEIGHT;

    const patch = [];

    const gridW = 16;

    const gridH = 18;

    for (
        let gy = 0;
        gy < gridH;
        gy++
    ) {

        const ny =
            gy / (gridH - 1);

        const y =
            cy - ry +
            ny * ry * 2;

        for (
            let gx = 0;
            gx < gridW;
            gx++
        ) {

            const nx =
                gx / (gridW - 1);

            const x =
                cx - rx +
                nx * rx * 2;

            patch.push(
                brightness(
                    image.data,
                    x,
                    y
                )
            );
        }
    }

    return patch;
}


/* ---------------------------------------------------------
   패치 차이
--------------------------------------------------------- */

function patchDifference(
    a,
    b
) {

    if (!a || !b) {
        return 1;
    }

    let total = 0;

    const length =
        Math.min(
            a.length,
            b.length
        );

    for (
        let i = 0;
        i < length;
        i++
    ) {

        total +=
            Math.abs(
                a[i] - b[i]
            ) / 255;
    }

    return total / length;
}


/* ---------------------------------------------------------
   핀 위치 주변의 특징 확인
--------------------------------------------------------- */

function pinAppearance(
    image,
    pin
) {

    const cx =
        pin.x * CONFIG.WIDTH;

    const cy =
        pin.y * CONFIG.HEIGHT;

    const rx =
        CONFIG.PIN_RX *
        CONFIG.WIDTH;

    const ry =
        CONFIG.PIN_RY *
        CONFIG.HEIGHT;

    let dark = 0;

    let bright = 0;

    let total = 0;

    for (
        let y = cy - ry;
        y <= cy + ry;
        y += 4
    ) {

        for (
            let x = cx - rx;
            x <= cx + rx;
            x += 4
        ) {

            const value =
                brightness(
                    image.data,
                    x,
                    y
                );

            if (
                value <
                CONFIG.DARK_LIMIT
            ) {
                dark++;
            }

            if (
                value >
                CONFIG.BRIGHT_LIMIT
            ) {
                bright++;
            }

            total++;
        }
    }

    return {
        darkRatio:
            dark / Math.max(1, total),

        brightRatio:
            bright / Math.max(1, total)
    };
}


/* ---------------------------------------------------------
   핀 존재 여부

   현재 제작된 핀은 흰색 + 검은 테이프라서
   밝은 영역과 어두운 영역이 함께 존재하는지 확인.
--------------------------------------------------------- */

function looksLikePin(
    image,
    pin
) {

    const a =
        pinAppearance(
            image,
            pin
        );

    return (
        a.brightRatio > 0.12 &&
        a.darkRatio > 0.008
    );
}


/* ---------------------------------------------------------
   핀 상태 템플릿 생성
--------------------------------------------------------- */

function createPinTemplates(
    image
) {

    standingTemplate = [];

    baselineTemplate = [];

    currentPinCenters = [];

    for (
        let i = 0;
        i < CONFIG.PINS.length;
        i++
    ) {

        const pin =
            CONFIG.PINS[i];

        const cx =
            pin.x *
            CONFIG.WIDTH;

        const cy =
            pin.y *
            CONFIG.HEIGHT;

        const patch =
            extractPatch(
                image,
                cx,
                cy
            );

        standingTemplate[i] =
            patch;

        baselineTemplate[i] =
            patch;

        currentPinCenters[i] = {
            x: cx,
            y: cy
        };
    }
}


/* ---------------------------------------------------------
   특정 핀이 현재 서 있는지
--------------------------------------------------------- */

function isPinStanding(
    image,
    index
) {

    const pin =
        CONFIG.PINS[index];

    const cx =
        pin.x *
        CONFIG.WIDTH;

    const cy =
        pin.y *
        CONFIG.HEIGHT;

    const current =
        extractPatch(
            image,
            cx,
            cy
        );

    const difference =
        patchDifference(
            current,
            standingTemplate[index]
        );

    return (
        difference <
        CONFIG.STANDING_THRESHOLD
    );
}


/* ---------------------------------------------------------
   현재 필요한 핀들이 모두 안정적으로 서 있는지
--------------------------------------------------------- */

function requiredPinsStanding(
    image
) {

    for (
        const index of requiredPins
    ) {

        if (
            !isPinStanding(
                image,
                index
            )
        ) {
            return false;
        }
    }

    return true;
}


/* ---------------------------------------------------------
   움직임 계산
--------------------------------------------------------- */

function motionScore(
    oldImage,
    newImage,
    roi
) {

    if (!oldImage || !newImage) {
        return 0;
    }

    const startX =
        Math.floor(
            roi.x *
            CONFIG.WIDTH
        );

    const endX =
        Math.floor(
            (roi.x + roi.w) *
            CONFIG.WIDTH
        );

    const startY =
        Math.floor(
            roi.y *
            CONFIG.HEIGHT
        );

    const endY =
        Math.floor(
            (roi.y + roi.h) *
            CONFIG.HEIGHT
        );

    let difference = 0;

    let count = 0;

    /*
       너무 많은 픽셀을 계산하지 않고
       5픽셀 간격으로 검사.
    */

    for (
        let y = startY;
        y < endY;
        y += 5
    ) {

        for (
            let x = startX;
            x < endX;
            x += 5
        ) {

            const p =
                (y * CONFIG.WIDTH + x) * 4;

            const a =
                (
                    oldImage.data[p] +
                    oldImage.data[p + 1] +
                    oldImage.data[p + 2]
                ) / 3;

            const b =
                (
                    newImage.data[p] +
                    newImage.data[p + 1] +
                    newImage.data[p + 2]
                ) / 3;

            difference +=
                Math.abs(a - b) / 255;

            count++;
        }
    }

    return difference /
        Math.max(1, count);
}


/* ---------------------------------------------------------
   핀 쓰러짐 판정
--------------------------------------------------------- */

function detectFallenPins(
    image
) {

    const fallen = [];

    const standing = [];

    for (
        const index of activePins
    ) {

        const pin =
            CONFIG.PINS[index];

        const cx =
            pin.x *
            CONFIG.WIDTH;

        const cy =
            pin.y *
            CONFIG.HEIGHT;

        const current =
            extractPatch(
                image,
                cx,
                cy
            );

        const diff =
            patchDifference(
                current,
                baselineTemplate[index]
            );

        /*
           현재 사진이
           투구 전 기준 사진과 크게 달라졌다면
           넘어졌다고 판단.
        */

        if (
            diff >
            CONFIG.FALL_THRESHOLD
        ) {

            fallen.push(index);

        } else {

            standing.push(index);
        }
    }

    return {
        fallen,
        standing
    };
}


/* ---------------------------------------------------------
   핀 UI
--------------------------------------------------------- */

function updatePinUI(
    standingPins
) {

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const el =
            document.getElementById(
                "pin" + i
            );

        el.classList.remove(
            "standing",
            "down"
        );

        if (
            standingPins.includes(i)
        ) {

            el.classList.add(
                "standing"
            );

        } else {

            el.classList.add(
                "down"
            );
        }
    }
}


/* ---------------------------------------------------------
   프레임 점수 계산
--------------------------------------------------------- */

function calculateScore(
    rollList
) {

    let total = 0;

    let index = 0;

    const frameScores = [];

    for (
        let frame = 1;
        frame <= 9;
        frame++
    ) {

        if (
            index >= rollList.length
        ) {
            frameScores.push(null);
            continue;
        }

        const first =
            rollList[index];

        if (
            first === 10
        ) {

            if (
                index + 2 >=
                rollList.length
            ) {

                frameScores.push(null);
                continue;
            }

            const score =
                10 +
                rollList[index + 1] +
                rollList[index + 2];

            total += score;

            frameScores.push(total);

            index += 1;

        } else {

            if (
                index + 1 >=
                rollList.length
            ) {

                frameScores.push(null);
                continue;
            }

            const second =
                rollList[index + 1];

            if (
                first + second === 10
            ) {

                if (
                    index + 2 >=
                    rollList.length
                ) {

                    frameScores.push(null);
                    continue;
                }

                total +=
                    10 +
                    rollList[index + 2];

            } else {

                total +=
                    first +
                    second;
            }

            frameScores.push(total);

            index += 2;
        }
    }


    /* 10프레임 */

    if (
        index < rollList.length
    ) {

        const a =
            rollList[index];

        const b =
            rollList[index + 1];

        const c =
            rollList[index + 2];

        if (
            a === 10
        ) {

            if (
                b !== undefined &&
                c !== undefined
            ) {

                total +=
                    a + b + c;

                frameScores.push(total);

            } else {

                frameScores.push(null);
            }

        } else if (
            b !== undefined
        ) {

            if (
                a + b === 10
            ) {

                if (
                    c !== undefined
                ) {

                    total +=
                        10 + c;

                    frameScores.push(total);

                } else {

                    frameScores.push(null);
                }

            } else {

                total +=
                    a + b;

                frameScores.push(total);
            }

        } else {

            frameScores.push(null);
        }
    }

    return {
        total,
        frameScores
    };
}


/* ---------------------------------------------------------
   프레임 화면
--------------------------------------------------------- */

function renderFrames() {

    const container =
        document.getElementById(
            "frames"
        );

    container.innerHTML = "";

    const scoreData =
        calculateScore(
            rolls
        );

    let rollIndex = 0;

    for (
        let frame = 1;
        frame <= 10;
        frame++
    ) {

        const box =
            document.createElement(
                "div"
            );

        box.className =
            "frame";

        if (
            frame === gameFrame
        ) {
            box.classList.add(
                "active"
            );
        }

        if (
            frame === 10
        ) {
            box.classList.add(
                "tenth"
            );
        }

        const number =
            document.createElement(
                "div"
            );

        number.className =
            "frameNumber";

        number.textContent =
            frame;

        box.appendChild(
            number
        );

        const rollBox =
            document.createElement(
                "div"
            );

        rollBox.className =
            "rolls";

        let numberOfRolls =
            frame === 10 ? 3 : 2;

        for (
            let r = 0;
            r < numberOfRolls;
            r++
        ) {

            const cell =
                document.createElement(
                    "div"
                );

            cell.className =
                "roll";

            if (
                rollIndex <
                rolls.length
            ) {

                const value =
                    rolls[rollIndex];

                /*
                   표시
                */

                if (
                    frame !== 10 &&
                    r === 0 &&
                    value === 10
                ) {

                    cell.textContent =
                        "X";

                } else if (
                    frame !== 10 &&
                    r === 1 &&
                    rolls[
                        rollIndex - 1
                    ] !== undefined &&
                    rolls[
                        rollIndex - 1
                    ] +
                    value === 10
                ) {

                    cell.textContent =
                        "/";

                } else {

                    cell.textContent =
                        value;
                }

                rollIndex++;
            }

            rollBox.appendChild(
                cell
            );
        }

        box.appendChild(
            rollBox
        );

        const score =
            document.createElement(
                "div"
            );

        score.className =
            "frameScore";

        const fs =
            scoreData.frameScores[
                frame - 1
            ];

        score.textContent =
            fs ?? "";

        box.appendChild(
            score
        );

        container.appendChild(
            box
        );
    }

    totalScoreEl.textContent =
        scoreData.total;
}


/* ---------------------------------------------------------
   결과 표시
--------------------------------------------------------- */

function showResult(
    knocked
) {

    lastResult = knocked;

    if (
        knocked === 10 &&
        activePins.length === 10
    ) {

        resultTextEl.textContent =
            "🎳 STRIKE";

        resultSubEl.textContent =
            "10개 모두 쓰러졌습니다";

        return;
    }


    if (
        ballNumber === 2
    ) {

        /*
           현재 프레임의 첫 투구
        */

        const previous =
            rolls[
                rolls.length - 1
            ];

        /*
           실제 계산은 rolls에 들어간 뒤
           다시 확인.
        */

        if (
            gameFrame <= 10
        ) {

            const frameRolls =
                getCurrentFrameRolls();

            if (
                frameRolls.length >= 2 &&
                frameRolls[0] +
                frameRolls[1] === 10
            ) {

                resultTextEl.textContent =
                    "✨ SPARE";

                resultSubEl.textContent =
                    "10개를 모두 쓰러뜨렸습니다";

                return;
            }
        }
    }


    resultTextEl.textContent =
        knocked + " PIN";

    resultSubEl.textContent =
        knocked +
        "개의 핀이 쓰러졌습니다";
}


/* ---------------------------------------------------------
   현재 프레임의 롤
--------------------------------------------------------- */

function getCurrentFrameRolls() {

    const result = [];

    let index = 0;

    for (
        let f = 1;
        f <= gameFrame;
        f++
    ) {

        if (
            f === gameFrame
        ) {
            break;
        }

        if (
            rolls[index] === 10
        ) {

            index += 1;

        } else {

            index += 2;
        }
    }

    while (
        index < rolls.length
    ) {

        result.push(
            rolls[index]
        );

        index++;

        /*
           현재 프레임까지만
        */

        if (
            result.length >= 3
        ) {
            break;
        }
    }

    return result;
}


/* ---------------------------------------------------------
   다음 투구 설정

   실제 볼링 방식으로 처리.

   1구에서 7개 쓰러짐
   → 살아남은 3개만 2구 대상

   스트라이크
   → 다음 프레임 10개
--------------------------------------------------------- */

function prepareNextTurn(
    fallen,
    standing
) {

    if (
        gameFrame < 10
    ) {

        /*
           1구
        */

        if (
            ballNumber === 1
        ) {

            if (
                fallen.length === 10
            ) {

                /*
                   STRIKE
                */

                gameFrame++;

                ballNumber = 1;

                activePins =
                    Array.from(
                        { length: 10 },
                        (_, i) => i
                    );

                requiredPins =
                    [...activePins];

            } else {

                /*
                   2구는 살아남은 핀만
                */

                ballNumber = 2;

                activePins =
                    [...standing];

                requiredPins =
                    [...standing];
            }

        } else {

            /*
               2구 끝
               다음 프레임
            */

            gameFrame++;

            ballNumber = 1;

            activePins =
                Array.from(
                    { length: 10 },
                    (_, i) => i
                );

            requiredPins =
                [...activePins];
        }

        return;
    }


    /*
       10프레임
    */

    if (
        ballNumber === 1
    ) {

        ballNumber = 2;

        if (
            fallen.length === 10
        ) {

            activePins =
                Array.from(
                    { length: 10 },
                    (_, i) => i
                );

            requiredPins =
                [...activePins];

        } else {

            activePins =
                [...standing];

            requiredPins =
                [...standing];
        }

        return;
    }


    if (
        ballNumber === 2
    ) {

        const current =
            getCurrentFrameRolls();

        const first =
            current[0];

        const second =
            current[1];

        /*
           스트라이크 또는 스페어면
           3구
        */

        if (
            first === 10
        ) {

            ballNumber = 3;

            if (
                second === 10
            ) {

                activePins =
                    Array.from(
                        { length: 10 },
                        (_, i) => i
                    );

                requiredPins =
                    [...activePins];

            } else {

                activePins =
                    [...standing];

                requiredPins =
                    [...standing];
            }

            return;
        }


        if (
            first +
            second === 10
        ) {

            ballNumber = 3;

            activePins =
                Array.from(
                    { length: 10 },
                    (_, i) => i
                );

            requiredPins =
                [...activePins];

            return;
        }


        /*
           10프레임 종료
        */

        gameFinished();

        return;
    }


    /*
       3구 종료
    */

    gameFinished();
}


/* ---------------------------------------------------------
   게임 종료
--------------------------------------------------------- */

function gameFinished() {

    state =
        "FINISHED";

    const score =
        calculateScore(
            rolls
        );

    resultTextEl.textContent =
        "🏆 GAME END";

    resultSubEl.textContent =
        "최종 점수 " +
        score.total;

    setStatus(
        "게임 종료",
        "페이지를 새로고침하면 새 게임을 시작할 수 있습니다."
    );

    renderFrames();
}


/* ---------------------------------------------------------
   결과 확정
--------------------------------------------------------- */

function finalizeThrow(
    image
) {

    const result =
        detectFallenPins(
            image
        );

    const fallen =
        result.fallen;

    const standing =
        result.standing;

    const knocked =
        fallen.length;

    /*
       점수 기록
    */

    rolls.push(
        knocked
    );

    updatePinUI(
        standing
    );

    showResult(
        knocked
    );

    renderFrames();

    /*
       다음 투구 준비
    */

    prepareNextTurn(
        fallen,
        standing
    );

    if (
        state === "FINISHED"
    ) {
        return;
    }

    /*
       핀 정리 단계
    */

    state =
        "RESETTING";

    resetStableCount = 0;

    setStatus(
        "핀 정리 중",
        "손으로 핀을 세워주세요. 안정되면 자동으로 다음 투구가 시작됩니다."
    );
}


/* ---------------------------------------------------------
   초기 기준 학습
--------------------------------------------------------- */

function setupGame(
    image
) {

    /*
       10개 모두 서 있어야 시작.
    */

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        if (
            !looksLikePin(
                image,
                CONFIG.PINS[i]
            )
        ) {

            return false;
        }
    }

    createPinTemplates(
        image
    );

    activePins =
        Array.from(
            { length: 10 },
            (_, i) => i
        );

    requiredPins =
        [...activePins];

    baselineImage =
        image;

    state =
        "READY";

    setupStableCount = 0;

    setStatus(
        "READY",
        "공을 굴리세요"
    );

    resultTextEl.textContent =
        "READY";

    resultSubEl.textContent =
        "10개 핀 기준 설정 완료";

    updatePinUI(
        activePins
    );

    return true;
}


/* ---------------------------------------------------------
   다음 투구 기준 저장
--------------------------------------------------------- */

function saveNextBaseline(
    image
) {

    baselineImage =
        image;

    baselineTemplate = [];

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const pin =
            CONFIG.PINS[i];

        const cx =
            pin.x *
            CONFIG.WIDTH;

        const cy =
            pin.y *
            CONFIG.HEIGHT;

        baselineTemplate[i] =
            extractPatch(
                image,
                cx,
                cy
            );
    }

    state =
        "READY";

    motionStartCount = 0;

    motionStopCount = 0;

    setStatus(
        "READY",
        "공을 굴리세요"
    );

    resultTextEl.textContent =
        "READY";

    resultSubEl.textContent =
        gameFrame +
        "프레임 · " +
        ballNumber +
        "구";

    updatePinUI(
        activePins
    );
}


/* ---------------------------------------------------------
   메인 분석
--------------------------------------------------------- */

function analyze() {

    if (
        !running ||
        video.readyState < 2
    ) {
        return;
    }

    const image =
        captureFrame();


    /* ==========================================
       초기 핀 설정
    ========================================== */

    if (
        state === "SETTING_UP"
    ) {

        if (
            setupGame(
                image
            )
        ) {

            setupStableCount++;

            /*
               바로 READY로 만들지 않고
               여러 프레임 확인.
            */

            if (
                setupStableCount <
                CONFIG.SETUP_STABLE_FRAMES
            ) {

                state =
                    "SETTING_UP";

                setStatus(
                    "핀 학습 중",
                    "10개 핀을 움직이지 말아주세요. " +
                    setupStableCount +
                    " / " +
                    CONFIG.SETUP_STABLE_FRAMES
                );

                /*
                   setupGame에서 READY가 되었으므로
                   다시 상태를 돌려놓음
                */

                state =
                    "SETTING_UP";

            } else {

                createPinTemplates(
                    image
                );

                baselineImage =
                    image;

                baselineTemplate = [];

                for (
                    let i = 0;
                    i < 10;
                    i++
                ) {

                    baselineTemplate[i] =
                        standingTemplate[i];
                }

                state =
                    "READY";

                setStatus(
                    "READY",
                    "공을 굴리세요"
                );

                resultTextEl.textContent =
                    "READY";

                resultSubEl.textContent =
                    "자동 감지 시작";

                updatePinUI(
                    activePins
                );
            }

        } else {

            setupStableCount = 0;

            setStatus(
                "핀을 찾는 중",
                "10개 핀을 모두 세우고 손을 빼주세요."
            );
        }

        previousImage =
            image;

        return;
    }


    /* ==========================================
       READY

       공이 굴러오는 아래쪽 영역만 감시.
       손으로 핀을 만지는 것은 투구로 인식하지 않음.
    ========================================== */

    if (
        state === "READY"
    ) {

        const motion =
            motionScore(
                previousImage,
                image,
                CONFIG.BALL_ROI
            );

        if (
            motion >
            CONFIG.MOTION_START
        ) {

            motionStartCount++;

        } else {

            motionStartCount = 0;
        }


        if (
            motionStartCount >=
            CONFIG.MOTION_START_FRAMES
        ) {

            state =
                "THROWING";

            motionStopCount = 0;

            setStatus(
                "투구 감지",
                "핀 움직임을 확인하는 중..."
            );

            resultTextEl.textContent =
                "🎳";

            resultSubEl.textContent =
                "공이 이동 중입니다";

            motionStartCount = 0;
        }

        previousImage =
            image;

        return;
    }


    /* ==========================================
       THROWING
    ========================================== */

    if (
        state === "THROWING"
    ) {

        const motion =
            motionScore(
                previousImage,
                image,
                CONFIG.BOARD_ROI
            );

        if (
            motion <
            CONFIG.MOTION_STOP
        ) {

            motionStopCount++;

        } else {

            motionStopCount = 0;
        }


        if (
            motionStopCount >=
            CONFIG.MOTION_STOP_FRAMES
        ) {

            /*
               마지막으로 한 번 더 촬영.
            */

            state =
                "CHECKING";

            setStatus(
                "판정 중",
                "쓰러진 핀을 계산하고 있습니다."
            );

            setTimeout(
                () => {

                    if (
                        running &&
                        state === "CHECKING"
                    ) {

                        const finalImage =
                            captureFrame();

                        finalizeThrow(
                            finalImage
                        );
                    }

                },
                650
            );
        }

        previousImage =
            image;

        return;
    }


    /* ==========================================
       RESETTING

       손으로 핀을 세우는 동안
       절대 점수 계산하지 않음.
    ========================================== */

    if (
        state === "RESETTING"
    ) {

        /*
           필요한 핀들이 모두 서 있는지
           먼저 확인.
        */

        const standing =
            requiredPinsStanding(
                image
            );

        /*
           전체 보드 움직임도 확인.
           손이 아직 들어와 있으면 안정화 카운트를
           다시 0으로 만듦.
        */

        const movement =
            motionScore(
                previousImage,
                image,
                CONFIG.BOARD_ROI
            );

        if (
            standing &&
            movement <
            CONFIG.MOTION_STOP
        ) {

            resetStableCount++;

        } else {

            resetStableCount = 0;
        }


        if (
            resetStableCount >=
            CONFIG.RESET_STABLE_FRAMES
        ) {

            saveNextBaseline(
                image
            );

            resetStableCount = 0;
        } else {

            setStatus(
                "핀 안정화 중",
                resetStableCount +
                " / " +
                CONFIG.RESET_STABLE_FRAMES
            );
        }

        previousImage =
            image;

        return;
    }


    /* ==========================================
       CHECKING
    ========================================== */

    if (
        state === "CHECKING"
    ) {

        previousImage =
            image;

        return;
    }


    previousImage =
        image;
}


/* ---------------------------------------------------------
   카메라 시작
--------------------------------------------------------- */

async function startCamera() {

    startButton.disabled =
        true;

    startButton.textContent =
        "카메라 준비 중...";

    try {

        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal: "environment"
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }
                    },

                    audio: false
                });


        video.srcObject =
            stream;

        await video.play();


        /*
           화면 꺼짐 방지.
           지원되는 경우만 사용.
        */

        try {

            if (
                "wakeLock" in navigator
            ) {

                await navigator.wakeLock
                    .request("screen");
            }

        } catch (e) {
            // 지원하지 않아도 게임에는 영향 없음
        }


        startButton.classList.add(
            "hidden"
        );


        running =
            true;

        state =
            "SETTING_UP";

        rolls = [];

        gameFrame = 1;

        ballNumber = 1;

        activePins =
            Array.from(
                { length: 10 },
                (_, i) => i
            );

        requiredPins =
            [...activePins];

        renderFrames();

        setStatus(
            "핀 학습 시작",
            "10개 핀을 모두 세우고 손을 빼주세요."
        );

        resultTextEl.textContent =
            "WAIT";

        resultSubEl.textContent =
            "자동으로 10개 핀을 인식합니다";


        /*
           첫 프레임 확보
        */

        await new Promise(
            resolve => {

                if (
                    video.readyState >= 2
                ) {

                    resolve();

                } else {

                    video.onloadeddata =
                        () => resolve();
                }
            }
        );


        previousImage =
            captureFrame();


        /*
           분석 루프
        */

        timer =
            setInterval(
                analyze,
                CONFIG.INTERVAL
            );

    } catch (error) {

        console.error(
            error
        );

        startButton.disabled =
            false;

        startButton.textContent =
            "📷 다시 시작";

        setStatus(
            "카메라를 시작할 수 없습니다",
            "Safari의 카메라 권한을 허용했는지 확인하세요."
        );
    }
}


/* ---------------------------------------------------------
   버튼
--------------------------------------------------------- */

startButton.addEventListener(
    "click",
    startCamera
);


/* ---------------------------------------------------------
   초기 프레임
--------------------------------------------------------- */

renderFrames();

</script>
