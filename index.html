<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mini Bowling Auto Score</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #05070b;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont,
                 "Apple SD Gothic Neo", sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#app {
    width: 100%;
    max-width: 700px;
    min-height: 100%;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* =========================
   상단
========================= */

.logo {
    text-align: center;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #8da7ff;
    margin-bottom: 8px;
}

#status {
    text-align: center;
    font-size: 14px;
    color: #aeb6c7;
    min-height: 22px;
    margin-bottom: 15px;
}

/* =========================
   카메라 시작
========================= */

#startScreen {
    position: fixed;
    inset: 0;
    background: #05070b;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.startBox {
    width: 100%;
    max-width: 380px;
    text-align: center;
}

.startBox h1 {
    font-size: 31px;
    margin: 0 0 12px;
}

.startBox p {
    color: #aeb6c7;
    line-height: 1.6;
    font-size: 14px;
}

#startButton {
    width: 100%;
    margin-top: 20px;
    border: 0;
    border-radius: 18px;
    padding: 17px;
    font-size: 17px;
    font-weight: 800;
    color: white;
    background: #315cf5;
}

/* =========================
   메인 점수판
========================= */

.scoreCard {
    background: linear-gradient(145deg, #111723, #080b11);
    border: 1px solid #202938;
    border-radius: 25px;
    padding: 20px;
    box-shadow: 0 15px 50px rgba(0,0,0,.35);
}

.topRow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.gameTitle {
    font-size: 15px;
    font-weight: 800;
    color: #b9c3d5;
}

.totalBox {
    text-align: right;
}

.totalLabel {
    font-size: 10px;
    color: #778197;
}

#totalScore {
    font-size: 34px;
    line-height: 1;
    font-weight: 900;
}

/* 현재 투구 */

.currentBox {
    border-radius: 18px;
    background: #0b1019;
    border: 1px solid #1d2737;
    padding: 17px;
    margin-bottom: 15px;
}

.currentTop {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#frameText {
    font-size: 17px;
    font-weight: 800;
}

#throwText {
    color: #8f9bb0;
    font-size: 13px;
}

#result {
    font-size: 43px;
    font-weight: 900;
    text-align: center;
    margin: 13px 0 4px;
}

#subResult {
    text-align: center;
    color: #8f9bb0;
    font-size: 13px;
}

/* =========================
   프레임 점수판
========================= */

.board {
    overflow-x: auto;
    padding-bottom: 4px;
}

.frames {
    min-width: 570px;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    border: 1px solid #273142;
    border-radius: 14px;
    overflow: hidden;
}

.frame {
    min-height: 76px;
    border-right: 1px solid #273142;
    background: #0c1119;
}

.frame:last-child {
    border-right: 0;
}

.frameNumber {
    height: 25px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #141b27;
    font-size: 11px;
    color: #8792a6;
}

.rolls {
    height: 24px;
    display: flex;
    justify-content: flex-end;
}

.roll {
    width: 50%;
    border-left: 1px solid #273142;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
}

.frameScore {
    height: 27px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 800;
}

/* =========================
   핀 상태
========================= */

.pinPanel {
    margin-top: 15px;
    padding: 13px;
    border-radius: 16px;
    background: #090e16;
    border: 1px solid #1c2635;
}

.pinTitle {
    color: #7f8ca2;
    font-size: 11px;
    margin-bottom: 9px;
}

.pinGrid {
    display: flex;
    justify-content: center;
    gap: 7px;
    flex-wrap: wrap;
}

.pinDot {
    width: 19px;
    height: 19px;
    border-radius: 50%;
    background: #30394a;
    border: 2px solid #566177;
}

.pinDot.active {
    background: #57d68d;
    border-color: #8cf0b6;
}

.pinDot.down {
    background: #e24d5b;
    border-color: #ff7782;
}

/* =========================
   안내
========================= */

#hint {
    text-align: center;
    color: #66738a;
    font-size: 12px;
    margin-top: 13px;
    min-height: 18px;
}

/*
    카메라 화면은 완전히 숨김.
    실제 영상은 JS에서 분석용으로만 사용한다.
*/
#camera {
    position: fixed;
    left: -1000px;
    top: -1000px;
    width: 2px;
    height: 2px;
    opacity: 0;
    pointer-events: none;
}

#canvas {
    position: fixed;
    left: -1000px;
    top: -1000px;
    width: 2px;
    height: 2px;
    opacity: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<!-- 최초 카메라 권한 -->
<div id="startScreen">
    <div class="startBox">
        <h1>🎳 MINI BOWLING</h1>

        <p>
            후면 카메라를 사용합니다.<br>
            카메라 화면은 표시되지 않습니다.<br><br>

            처음에는 핀 10개를 모두 세워주세요.<br>
            핀이 안정되면 자동으로 게임이 시작됩니다.
        </p>

        <button id="startButton">
            게임 시작
        </button>
    </div>
</div>

<!-- 실제 화면 -->
<div id="app">

    <div class="logo">

    <div id="status">

        </div>

        <div class="board">

            <div class="frames" id="frames">

                <div class="frame">

                <div class="frame">

                    </div>
                    <div class="frameScore"></div>
                </div>

                <div class="frame">
                    <div class="frameNumber">4</div>
                    <div class="rolls">
                        <div class="roll"></div>
                        <div class="roll"></div>
                    </div>
                    <div class="frameScore"></div>
                </div>

                <div class="frame">
                    <div class="frameNumber">5</div>
                    <div class="rolls">
                        <div class="roll"></div>
                        <div class="roll"></div>
                    </div>
                    <div class="frameScore"></div>
                </div>

                <div class="frame">
                    <div class="frameNumber">6</div>
                    <div class="rolls">
                        <div class="roll"></div>
                        <div class="roll"></div>
                    </div>
                    <div class="frameScore"></div>
                </div>

                <div class="frame">
                    <div class="frameNumber">7</div>
                    <div class="rolls">
                        <div class="roll"></div>
                        <div class="roll"></div>
                    </div>
                    <div class="frameScore"></div>
                </div>

                <div class="frame">
                    <div class="frameNumber">8</div>
                    <div class="rolls">
                        <div class="roll"></div>
                        <div class="roll"></div>
                    </div>
                    <div class="frameScore"></div>
                </div>

                <div class="frame">
                    <div class="frameNumber">9</div>
                    <div class="rolls">
                        <div class="roll"></div>
                        <div class="roll"></div>
                    </div>
                    <div class="frameScore"></div>
                </div>

                <div class="frame">
                    <div class="frameNumber">10</div>
                    <div class="rolls">
                        <div class="roll"></div>
                        <div class="roll"></div>
                    </div>
                    <div class="frameScore"></div>
                </div>

            </div>

        </div>

        <div class="pinPanel">

            <div class="pinTitle">
                PIN STATUS
            </div>

            <div class="pinGrid" id="pinGrid">

                <div class="pinDot"></div>
                <div class="pinDot"></div>
                <div class="pinDot"></div>
                <div class="pinDot"></div>
                <div class="pinDot"></div>
                <div class="pinDot"></div>
                <div class="pinDot"></div>
                <div class="pinDot"></div>
                <div class="pinDot"></div>
                <div class="pinDot"></div>

            </div>

        </div>

        <div id="hint">
            자동 감지 준비 중
        </div>

    </div>

</div>

<!-- 후면 카메라 -->
<video
    id="camera"
    autoplay
    muted
    playsinline
></video>

<!-- 분석용 -->
<canvas id="canvas"></canvas>


<script>

   기본 설정
========================================================= */

     * 실제 분석 해상도.

     */
